name: Build Trio (with TandemKit under test)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      trio_repo:
        description: "Repo to build (must contain TandemKit submodule at path TandemKit)"
        required: false
        default: "jwoglom/Trio-tandem"
      trio_ref:
        description: "Git ref (branch/tag/SHA) for trio_repo"
        required: false
        default: ""

jobs:
  build-trio:
    runs-on: macos-latest
    env:
      TRIO_REPO: ${{ github.event.inputs.trio_repo || 'jwoglom/Trio-tandem' }}
      TRIO_REF: ${{ github.event.inputs.trio_ref || '' }}
      DERIVED_DATA_PATH: DerivedData
      TRIO_REPO_TOKEN: ${{ secrets.TRIO_REPO_TOKEN }}
    steps:
      # Checkout TandemKit under test into a subfolder so we can also checkout Trio.
      - name: Checkout TandemKit (this repo)
        uses: actions/checkout@v4
        with:
          path: tandemkit

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Select an available iPhone simulator
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re, subprocess
          
          def runtime_sort_key(rt: str):
            # rt looks like: com.apple.CoreSimulator.SimRuntime.iOS-18-6
            m = re.search(r"iOS-(\d+)-(\d+)", rt)
            return (int(m.group(1)), int(m.group(2))) if m else (0, 0)
          
          data = subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"], text=True)
          j = json.loads(data)
          
          ios_runtimes = sorted([rt for rt in j.get("devices", {}).keys() if ".iOS-" in rt], key=runtime_sort_key, reverse=True)
          if not ios_runtimes:
            raise SystemExit("No iOS runtimes found on runner")
          
          candidates = []
          for rt in ios_runtimes:
            for dev in j["devices"].get(rt, []):
              if not dev.get("isAvailable"):
                continue
              name = dev.get("name", "")
              if name.startswith("iPhone"):
                candidates.append((name, dev.get("udid"), rt))
            if candidates:
              break
          
          if not candidates:
            raise SystemExit("No available iPhone simulators found on runner")
          
          # Prefer iPhone 16 if present, else first available iPhone.
          preferred = next((c for c in candidates if c[0] == "iPhone 16"), candidates[0])
          name, udid, rt = preferred
          print(f"Selected simulator: {name} ({udid}) [{rt}]")
          
          with open("${GITHUB_ENV}", "a") as f:
            f.write(f"SIMULATOR_DESTINATION=platform=iOS Simulator,id={udid}\n")
          PY

      - name: Ensure TRIO_REPO_TOKEN is available (required for private Trio repo)
        if: ${{ env.TRIO_REPO == 'jwoglom/Trio-tandem' && env.TRIO_REPO_TOKEN == '' }}
        run: |
          echo "Missing required secret TRIO_REPO_TOKEN."
          echo "This is expected for forked PRs (secrets are not provided)."
          echo "Fix: run CI from a branch in the main repo, or enable secrets for fork PRs in repo Settings -> Actions."
          exit 1

      - name: Checkout Trio app repository (default branch, with submodules)
        if: env.TRIO_REF == ''
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TRIO_REPO }}
          path: trio
          submodules: recursive
          fetch-depth: 1
          # For private repos in other orgs, set TRIO_REPO_TOKEN as a repo secret.
          token: ${{ env.TRIO_REPO_TOKEN }}

      - name: Checkout Trio app repository (specific ref, with submodules)
        if: env.TRIO_REF != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TRIO_REPO }}
          ref: ${{ env.TRIO_REF }}
          path: trio
          submodules: recursive
          fetch-depth: 1
          token: ${{ env.TRIO_REPO_TOKEN }}

      - name: Replace Trio TandemKit submodule with TandemKit under test
        run: |
          set -euo pipefail
          if [[ ! -d "trio/TandemKit" ]]; then
            echo "Expected Trio repo to have TandemKit at path 'TandemKit' (missing: trio/TandemKit)" >&2
            exit 1
          fi

          rm -rf "trio/TandemKit"
          mkdir -p "trio/TandemKit"

          # Copy the tested TandemKit into Trio/TandemKit, excluding git metadata and build artifacts.
          rsync -a --delete \
            --exclude ".git" \
            --exclude ".github" \
            --exclude "build" \
            --exclude ".build" \
            --exclude "DerivedData" \
            "tandemkit/" "trio/TandemKit/"

      - name: Cache SwiftPM artifacts
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.DERIVED_DATA_PATH }}/SourcePackages
            ~/.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('trio/**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve packages
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies \
            -workspace "trio/Trio.xcworkspace" \
            -scheme "Trio" \
            -derivedDataPath "${DERIVED_DATA_PATH}"

      - name: Build Trio (iOS Simulator)
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace "trio/Trio.xcworkspace" \
            -scheme "Trio" \
            -configuration Debug \
            -destination "${SIMULATOR_DESTINATION}" \
            -derivedDataPath "${DERIVED_DATA_PATH}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee "xcodebuild-build.log"

      - name: Upload xcodebuild log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-build.log
          path: xcodebuild-build.log

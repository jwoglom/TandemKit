name: Build Trio (with TandemKit under test)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      trio_repo:
        description: "Repo to build (must contain TandemKit submodule at path TandemKit)"
        required: false
        default: "jwoglom/Trio-tandem"
      trio_ref:
        description: "Git ref (branch/tag/SHA) for trio_repo"
        required: false
        default: ""

jobs:
  build-trio:
    runs-on: macos-latest
    env:
      TRIO_REPO: ${{ github.event.inputs.trio_repo || 'jwoglom/Trio-tandem' }}
      TRIO_REF: ${{ github.event.inputs.trio_ref || '' }}
      DERIVED_DATA_PATH: DerivedData
    steps:
      # Checkout TandemKit under test into a subfolder so we can also checkout Trio.
      - name: Checkout TandemKit (this repo)
        uses: actions/checkout@v4
        with:
          path: tandemkit

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Checkout Trio app repository (default branch, with submodules)
        if: env.TRIO_REF == ''
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TRIO_REPO }}
          path: trio
          submodules: recursive
          fetch-depth: 1
          # For private repos in other orgs, set TRIO_REPO_TOKEN as a repo secret.
          token: ${{ secrets.TRIO_REPO_TOKEN || github.token }}

      - name: Checkout Trio app repository (specific ref, with submodules)
        if: env.TRIO_REF != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TRIO_REPO }}
          ref: ${{ env.TRIO_REF }}
          path: trio
          submodules: recursive
          fetch-depth: 1
          token: ${{ secrets.TRIO_REPO_TOKEN || github.token }}

      - name: Replace Trio TandemKit submodule with TandemKit under test
        run: |
          set -euo pipefail
          if [[ ! -d "trio/TandemKit" ]]; then
            echo "Expected Trio repo to have TandemKit at path 'TandemKit' (missing: trio/TandemKit)" >&2
            exit 1
          fi

          rm -rf "trio/TandemKit"
          mkdir -p "trio/TandemKit"

          # Copy the tested TandemKit into Trio/TandemKit, excluding git metadata and build artifacts.
          rsync -a --delete \
            --exclude ".git" \
            --exclude ".github" \
            --exclude "build" \
            --exclude ".build" \
            --exclude "DerivedData" \
            "tandemkit/" "trio/TandemKit/"

      - name: Cache SwiftPM artifacts
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.DERIVED_DATA_PATH }}/SourcePackages
            ~/.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('trio/**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve packages
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies \
            -workspace "trio/Trio.xcworkspace" \
            -scheme "Trio" \
            -derivedDataPath "${DERIVED_DATA_PATH}"

      - name: Build Trio (iOS Simulator)
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace "trio/Trio.xcworkspace" \
            -scheme "Trio" \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=iPhone 15" \
            -derivedDataPath "${DERIVED_DATA_PATH}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee "xcodebuild-build.log"

      - name: Upload xcodebuild log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-build.log
          path: xcodebuild-build.log

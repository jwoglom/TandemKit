name: Build Trio (with TandemKit under test)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request_target:
    types: [ labeled ]
    branches: [ main, dev ]
  workflow_dispatch:
    inputs:
      trio_repo:
        description: "Repo to build (must contain TandemKit submodule at path TandemKit)"
        required: false
        default: "jwoglom/Trio-tandem"
      trio_ref:
        description: "Git ref (branch/tag/SHA) for trio_repo"
        required: false
        default: ""

jobs:
  build-trio:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_target' && github.event.label.name == 'trigger-ci')
    runs-on: [self-hosted, macOS]
    timeout-minutes: 20
    env:
      TRIO_REPO: ${{ github.event.inputs.trio_repo || 'jwoglom/Trio-tandem' }}
      TRIO_REF: ${{ github.event.inputs.trio_ref || '' }}
      DERIVED_DATA_PATH: DerivedData
      SPM_CACHE_PATH: .spm
      TRIO_REPO_TOKEN: ${{ secrets.TRIO_REPO_TOKEN }}
      XCODEBUILD_COMMON_FLAGS: >-
        -skipMacroValidation
        -skipPackagePluginValidation
    steps:
      # The shared actions live in this repo, and trio/TandemKit cannot be checked out before the
      # Trio checkout (which empties trio/), so fetch just the actions first.
      - name: Checkout TandemKit CI actions
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          path: .tandemkit-ci
          sparse-checkout: .github/actions
          fetch-depth: 1

      - name: Set up Xcode and a simulator
        uses: ./.tandemkit-ci/.github/actions/setup-simulator
        with:
          boot: 'false'

      - name: Check out Trio with TandemKit under test
        uses: ./.tandemkit-ci/.github/actions/checkout-trio
        with:
          repository: ${{ env.TRIO_REPO }}
          ref: ${{ env.TRIO_REF }}
          token: ${{ env.TRIO_REPO_TOKEN }}
          tandemkit-ref: ${{ github.event.pull_request.head.sha || github.ref }}

      - name: Validate Xcode source membership (all targets)
        run: |
          ruby -e 'begin; require "xcodeproj"; rescue LoadError; exit 1; end' || gem install xcodeproj --no-document
          ruby scripts/check_xcodeproj_source_membership.rb --check
        working-directory: trio/TandemKit

      - name: Cache SwiftPM artifacts
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.DERIVED_DATA_PATH }}/SourcePackages
            ~/.swiftpm
            ${{ env.SPM_CACHE_PATH }}
          key: ${{ runner.os }}-xcode-${{ env.XCODE_VERSION }}-spm-${{ hashFiles('trio/**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-xcode-${{ env.XCODE_VERSION }}-spm-

      # Its own marker because restore-keys match by prefix: a bare `-dd-trio-` also matched test.yml's
      # ad-hoc-signed `-dd-trio-v2-` snapshots, which force a full rebuild under these signing flags.
      - name: Cache Xcode DerivedData intermediates
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.DERIVED_DATA_PATH }}/Build
            ${{ env.DERIVED_DATA_PATH }}/ModuleCache.noindex
          key: ${{ runner.os }}-xcode-${{ env.XCODE_VERSION }}-dd-trio-build-${{ hashFiles('trio/**/Package.resolved', 'trio/**/*.xcodeproj/project.pbxproj', 'trio/**/*.xcworkspace/contents.xcworkspacedata') }}
          restore-keys: |
            ${{ runner.os }}-xcode-${{ env.XCODE_VERSION }}-dd-trio-build-${{ hashFiles('trio/**/Package.resolved') }}-
            ${{ runner.os }}-xcode-${{ env.XCODE_VERSION }}-dd-trio-build-

      - name: Build Trio (iOS Simulator)
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace "trio/Trio.xcworkspace" \
            -scheme "Trio" \
            -configuration Debug \
            -destination "${SIMULATOR_DESTINATION}" \
            -derivedDataPath "${DERIVED_DATA_PATH}" \
            ${XCODEBUILD_COMMON_FLAGS} \
            -quiet \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee "xcodebuild-build.log"

      - name: Upload xcodebuild log (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcodebuild-build.log
          path: xcodebuild-build.log

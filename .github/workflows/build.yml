name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout TandemKit
        uses: actions/checkout@v3
        with:
          path: TandemKit

      - name: Checkout LoopKit
        uses: actions/checkout@v3
        with:
          repository: LoopKit/LoopKit
          ref: loop-release/v2.x
          path: LoopKit

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'
      - name: Setup workspace configuration
        working-directory: TandemKit
        run: |
          # Use local Package manifest that references ../LoopKit
          cp Package.local.swift Package.swift
          # Use local Cartfile with absolute path to LoopKit
          export PWD=$(pwd)
          sed "s|\${PWD}|$PWD|g" Cartfile.local > Cartfile.resolved.local
          echo "Using workspace configuration with local LoopKit"

      - name: Install Carthage
        run: brew install carthage
        working-directory: TandemKit

      - name: Bootstrap Carthage dependencies
        working-directory: TandemKit
        run: |
          set -o pipefail
          # Use local Cartfile if it exists, otherwise use default
          if [ -f Cartfile.resolved.local ]; then
            mv Cartfile.resolved.local Cartfile
          fi
          ./carthage.sh bootstrap --platform iOS --no-use-binaries --use-xcframeworks --verbose 2>&1 | tee carthage.log
      - name: Upload Carthage log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: carthage-xcodebuild.log
          path: TandemKit/carthage.log

      - name: Build TandemKit XCFramework
        working-directory: TandemKit
        run: |
          xcodebuild archive \
            -project TandemKit.xcodeproj -scheme TandemKit \
            -destination 'generic/platform=iOS' \
            -archivePath build/ios \
            SKIP_INSTALL=NO BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          xcodebuild archive \
            -project TandemKit.xcodeproj -scheme TandemKit \
            -destination 'generic/platform=iOS Simulator' \
            -archivePath build/ios-sim \
            SKIP_INSTALL=NO BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          xcodebuild -create-xcframework \
            -framework build/ios.xcarchive/Products/Library/Frameworks/TandemKit.framework \
            -framework build/ios-sim.xcarchive/Products/Library/Frameworks/TandemKit.framework \
            -output build/TandemKit.xcframework
          cd build
          zip -r TandemKit.xcframework.zip TandemKit.xcframework
      - name: Upload TandemKit XCFramework
        uses: actions/upload-artifact@v4
        with:
          name: TandemKit.xcframework
          path: TandemKit/build/TandemKit.xcframework.zip

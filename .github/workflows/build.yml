name: Build Trio (with TandemKit under test)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request_target:
    types: [ labeled ]
    branches: [ main ]
  workflow_dispatch:
    inputs:
      trio_repo:
        description: "Repo to build (must contain TandemKit submodule at path TandemKit)"
        required: false
        default: "jwoglom/Trio-tandem"
      trio_ref:
        description: "Git ref (branch/tag/SHA) for trio_repo"
        required: false
        default: ""

jobs:
  build-trio:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_target' && github.event.label.name == 'trigger-ci')
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      TRIO_REPO: ${{ github.event.inputs.trio_repo || 'jwoglom/Trio-tandem' }}
      TRIO_REF: ${{ github.event.inputs.trio_ref || '' }}
      DERIVED_DATA_PATH: DerivedData
      SPM_CACHE_PATH: .spm
      TRIO_REPO_TOKEN: ${{ secrets.TRIO_REPO_TOKEN }}
      XCODEBUILD_COMMON_FLAGS: >-
        -skipMacroValidation
        -skipPackagePluginValidation
    steps:
      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Capture Xcode version for cache keys
        run: |
          set -euo pipefail
          XCODE_VERSION="$(xcodebuild -version | awk 'NR==1{print $2}')"
          echo "XCODE_VERSION=${XCODE_VERSION}" >> "${GITHUB_ENV}"

      - name: Select an available iPhone simulator
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, subprocess
          
          def runtime_sort_key(rt: str):
            # rt looks like: com.apple.CoreSimulator.SimRuntime.iOS-18-6
            m = re.search(r"iOS-(\d+)-(\d+)", rt)
            return (int(m.group(1)), int(m.group(2))) if m else (0, 0)
          
          data = subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"], text=True)
          j = json.loads(data)
          
          ios_runtimes = sorted([rt for rt in j.get("devices", {}).keys() if ".iOS-" in rt], key=runtime_sort_key, reverse=True)
          if not ios_runtimes:
            raise SystemExit("No iOS runtimes found on runner")
          
          candidates = []
          for rt in ios_runtimes:
            for dev in j["devices"].get(rt, []):
              if not dev.get("isAvailable"):
                continue
              name = dev.get("name", "")
              if name.startswith("iPhone"):
                candidates.append((name, dev.get("udid"), rt))
            if candidates:
              break
          
          if not candidates:
            raise SystemExit("No available iPhone simulators found on runner")
          
          # Prefer iPhone 16 if present, else first available iPhone.
          preferred = next((c for c in candidates if c[0] == "iPhone 16"), candidates[0])
          name, udid, rt = preferred
          print(f"Selected simulator: {name} ({udid}) [{rt}]")
          
          with open(os.environ["GITHUB_ENV"], "a") as f:
            f.write(f"SIMULATOR_DESTINATION=platform=iOS Simulator,id={udid}\n")
          PY

      - name: Ensure TRIO_REPO_TOKEN is available (required for private Trio repo)
        if: ${{ env.TRIO_REPO == 'jwoglom/Trio-tandem' && env.TRIO_REPO_TOKEN == '' }}
        run: |
          echo "Missing required secret TRIO_REPO_TOKEN."
          echo "This is expected for forked PRs (secrets are not provided)."
          echo "Fix: run CI from a branch in the main repo, or enable secrets for fork PRs in repo Settings -> Actions."
          exit 1

      - name: Checkout Trio app repository (default branch, no submodules)
        if: env.TRIO_REF == ''
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TRIO_REPO }}
          path: trio
          submodules: false
          fetch-depth: 1
          # For private repos in other orgs, set TRIO_REPO_TOKEN as a repo secret.
          token: ${{ env.TRIO_REPO_TOKEN }}

      - name: Checkout Trio app repository (specific ref, no submodules)
        if: env.TRIO_REF != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TRIO_REPO }}
          ref: ${{ env.TRIO_REF }}
          path: trio
          submodules: false
          fetch-depth: 1
          token: ${{ env.TRIO_REPO_TOKEN }}

      - name: Remove Trio TandemKit submodule working tree placeholder
        run: |
          set -euo pipefail
          rm -rf "trio/TandemKit"

      - name: Checkout TandemKit under test into Trio/TandemKit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          path: trio/TandemKit
          fetch-depth: 1

      - name: Validate TandemCore Xcode source membership
        run: |
          ruby -e 'begin; require "xcodeproj"; rescue LoadError; exit 1; end' || gem install xcodeproj --no-document
          ruby scripts/check_xcodeproj_source_membership.rb --check
        working-directory: trio/TandemKit

      - name: Initialize Trio submodules (excluding TandemKit)
        run: |
          set -euo pipefail
          cd trio

          if [[ ! -f ".gitmodules" ]]; then
            exit 0
          fi

          git submodule sync --recursive

          submodule_paths=()
          while IFS= read -r path; do
            [[ -z "${path}" ]] && continue
            [[ "${path}" == "TandemKit" ]] && continue
            submodule_paths+=("${path}")
          done < <(git config -f .gitmodules --get-regexp '^submodule\..*\.path$' | awk '{print $2}')

          if [[ ${#submodule_paths[@]} -eq 0 ]]; then
            exit 0
          fi

          git submodule update --init --recursive --depth 1 "${submodule_paths[@]}"

      - name: Cache SwiftPM artifacts
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.DERIVED_DATA_PATH }}/SourcePackages
            ~/.swiftpm
            ${{ env.SPM_CACHE_PATH }}
          key: ${{ runner.os }}-xcode-${{ env.XCODE_VERSION }}-spm-${{ hashFiles('trio/**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-xcode-${{ env.XCODE_VERSION }}-spm-

      - name: Cache Xcode DerivedData intermediates
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.DERIVED_DATA_PATH }}/Build
            ${{ env.DERIVED_DATA_PATH }}/ModuleCache.noindex
          key: ${{ runner.os }}-xcode-${{ env.XCODE_VERSION }}-dd-trio-${{ hashFiles('trio/**/Package.resolved', 'trio/**/*.xcodeproj/project.pbxproj', 'trio/**/*.xcworkspace/contents.xcworkspacedata') }}
          restore-keys: |
            ${{ runner.os }}-xcode-${{ env.XCODE_VERSION }}-dd-trio-${{ hashFiles('trio/**/Package.resolved') }}-
            ${{ runner.os }}-xcode-${{ env.XCODE_VERSION }}-dd-trio-

      - name: Build Trio (iOS Simulator)
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace "trio/Trio.xcworkspace" \
            -scheme "Trio" \
            -configuration Debug \
            -destination "${SIMULATOR_DESTINATION}" \
            -derivedDataPath "${DERIVED_DATA_PATH}" \
            ${XCODEBUILD_COMMON_FLAGS} \
            -quiet \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee "xcodebuild-build.log"

      - name: Upload xcodebuild log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-build.log
          path: xcodebuild-build.log

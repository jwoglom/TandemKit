name: Test Trio (with TandemKit under test)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build.yml'
      - '.github/workflows/test.yml'
      - 'Sources/**'
      - 'Tests/**'
      - 'Package.swift'
      - 'Package.resolved'
      - '*.xcodeproj/**'
      - '*.xcworkspace/**'
  pull_request_target:
    types: [ labeled ]
    branches: [ main ]
  workflow_dispatch:
    inputs:
      trio_repo:
        description: "Repo to test (must contain TandemKit submodule at path TandemKit)"
        required: false
        default: "jwoglom/Trio-tandem"
      trio_ref:
        description: "Git ref (branch/tag/SHA) for trio_repo"
        required: false
        default: ""

jobs:
  test-trio:
    if: >
      github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_target' && github.event.label.name == 'trigger-ci')
    runs-on: macos-latest
    timeout-minutes: 25
    environment: ${{ github.event_name == 'pull_request_target' && 'pr-testing' || '' }}
    env:
      TRIO_REPO: ${{ github.event.inputs.trio_repo || 'jwoglom/Trio-tandem' }}
      TRIO_REF: ${{ github.event.inputs.trio_ref || '' }}
      DERIVED_DATA_PATH: DerivedData
      SPM_CACHE_PATH: .spm
      TRIO_REPO_TOKEN: ${{ secrets.TRIO_REPO_TOKEN }}
      XCODEBUILD_COMMON_FLAGS: >-
        -skipMacroValidation
        -skipPackagePluginValidation
    steps:
      - name: Checkout TandemKit (this repo)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          path: tandemkit

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Capture Xcode version for cache keys
        run: |
          set -euo pipefail
          XCODE_VERSION="$(xcodebuild -version | awk 'NR==1{print $2}')"
          echo "XCODE_VERSION=${XCODE_VERSION}" >> "${GITHUB_ENV}"

      - name: Select an available iPhone simulator
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, subprocess
          
          def runtime_sort_key(rt: str):
            m = re.search(r"iOS-(\d+)-(\d+)", rt)
            return (int(m.group(1)), int(m.group(2))) if m else (0, 0)
          
          data = subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"], text=True)
          j = json.loads(data)
          
          ios_runtimes = sorted([rt for rt in j.get("devices", {}).keys() if ".iOS-" in rt], key=runtime_sort_key, reverse=True)
          if not ios_runtimes:
            raise SystemExit("No iOS runtimes found on runner")
          
          candidates = []
          for rt in ios_runtimes:
            for dev in j["devices"].get(rt, []):
              if not dev.get("isAvailable"):
                continue
              name = dev.get("name", "")
              if name.startswith("iPhone"):
                candidates.append((name, dev.get("udid"), rt))
            if candidates:
              break
          
          if not candidates:
            raise SystemExit("No available iPhone simulators found on runner")
          
          preferred = next((c for c in candidates if c[0] == "iPhone 16"), candidates[0])
          name, udid, rt = preferred
          print(f"Selected simulator: {name} ({udid}) [{rt}]")
          
          with open(os.environ["GITHUB_ENV"], "a") as f:
            f.write(f"SIMULATOR_DESTINATION=platform=iOS Simulator,id={udid}\n")
          PY

      - name: Ensure TRIO_REPO_TOKEN is available (required for private Trio repo)
        if: ${{ env.TRIO_REPO == 'jwoglom/Trio-tandem' && env.TRIO_REPO_TOKEN == '' }}
        run: |
          echo "Missing required secret TRIO_REPO_TOKEN."
          echo "This is expected for forked PRs (secrets are not provided)."
          echo "Fix: run CI from a branch in the main repo, or enable secrets for fork PRs in repo Settings -> Actions."
          exit 1

      - name: Checkout Trio app repository (default branch, with submodules)
        if: env.TRIO_REF == ''
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TRIO_REPO }}
          path: trio
          submodules: recursive
          fetch-depth: 1
          token: ${{ env.TRIO_REPO_TOKEN }}

      - name: Checkout Trio app repository (specific ref, with submodules)
        if: env.TRIO_REF != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TRIO_REPO }}
          ref: ${{ env.TRIO_REF }}
          path: trio
          submodules: recursive
          fetch-depth: 1
          token: ${{ env.TRIO_REPO_TOKEN }}

      - name: Replace Trio TandemKit submodule with TandemKit under test
        run: |
          set -euo pipefail
          if [[ ! -d "trio/TandemKit" ]]; then
            echo "Expected Trio repo to have TandemKit at path 'TandemKit' (missing: trio/TandemKit)" >&2
            exit 1
          fi

          rm -rf "trio/TandemKit"
          mkdir -p "trio/TandemKit"

          rsync -a --delete \
            --exclude ".git" \
            --exclude ".github" \
            --exclude "build" \
            --exclude ".build" \
            --exclude "DerivedData" \
            "tandemkit/" "trio/TandemKit/"

      - name: Cache SwiftPM artifacts
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.DERIVED_DATA_PATH }}/SourcePackages
            ~/.swiftpm
            ${{ env.SPM_CACHE_PATH }}
          key: ${{ runner.os }}-xcode-${{ env.XCODE_VERSION }}-spm-${{ hashFiles('trio/**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-xcode-${{ env.XCODE_VERSION }}-spm-

      - name: Cache Xcode DerivedData intermediates
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.DERIVED_DATA_PATH }}/Build
            ${{ env.DERIVED_DATA_PATH }}/ModuleCache.noindex
          key: ${{ runner.os }}-xcode-${{ env.XCODE_VERSION }}-dd-test-${{ hashFiles('trio/**/Package.resolved', 'tandemkit/Package.swift', 'tandemkit/Sources/**', 'tandemkit/Tests/**', 'trio/**/*.xcodeproj/**', 'trio/**/*.xcworkspace/**') }}
          restore-keys: |
            ${{ runner.os }}-xcode-${{ env.XCODE_VERSION }}-dd-test-${{ hashFiles('trio/**/Package.resolved') }}-
            ${{ runner.os }}-xcode-${{ env.XCODE_VERSION }}-dd-test-

      - name: Boot selected simulator
        run: |
          set -euo pipefail
          UDID="${SIMULATOR_DESTINATION##*id=}"
          xcrun simctl bootstatus "${UDID}" -b || true

      - name: Build Trio tests for execution (no test run)
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -workspace "trio/Trio.xcworkspace" \
            -scheme "Trio Tests" \
            -configuration Debug \
            -destination "${SIMULATOR_DESTINATION}" \
            -derivedDataPath "${DERIVED_DATA_PATH}" \
            ${XCODEBUILD_COMMON_FLAGS} \
            -quiet \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee "xcodebuild-build-for-testing.log"

      - name: Run Trio tests without rebuilding
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -workspace "trio/Trio.xcworkspace" \
            -scheme "Trio Tests" \
            -configuration Debug \
            -destination "${SIMULATOR_DESTINATION}" \
            -derivedDataPath "${DERIVED_DATA_PATH}" \
            -resultBundlePath "TrioTests.xcresult" \
            ${XCODEBUILD_COMMON_FLAGS} \
            -retry-tests-on-failure \
            -test-iterations 2 \
            -quiet \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee "xcodebuild-test.log"

      - name: Upload test logs/results (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: trio-test-artifacts
          path: |
            xcodebuild-build-for-testing.log
            xcodebuild-test.log
            TrioTests.xcresult

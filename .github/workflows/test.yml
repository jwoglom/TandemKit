name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout TandemKit
        uses: actions/checkout@v3
        with:
          path: TandemKit

      - name: Checkout LoopKit
        uses: actions/checkout@v3
        with:
          repository: LoopKit/LoopKit
          ref: loop-release/v2.x
          path: LoopKit

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'
      - name: Setup workspace configuration
        working-directory: TandemKit
        run: |
          # Use local Package manifest that references ../LoopKit
          cp Package.local.swift Package.swift
          # Use local Cartfile with absolute path to LoopKit
          export PWD=$(pwd)
          sed "s|\${PWD}|$PWD|g" Cartfile.local > Cartfile.resolved.local
          # Alternatively, we can skip Carthage and just use SPM
          echo "Using workspace configuration with local LoopKit"

      - name: Install Carthage
        run: brew install carthage
        working-directory: TandemKit

      - name: Bootstrap Carthage dependencies
        working-directory: TandemKit
        run: |
          set -o pipefail
          # Use local Cartfile if it exists, otherwise use default
          if [ -f Cartfile.resolved.local ]; then
            mv Cartfile.resolved.local Cartfile
          fi
          ./carthage.sh bootstrap --platform iOS --no-use-binaries --use-xcframeworks --verbose 2>&1 | tee carthage.log
      - name: Upload Carthage log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: carthage-xcodebuild.log
          path: TandemKit/carthage.log

      - name: Run swift test with XML output
        working-directory: TandemKit
        run: |
          swift test --enable-test-discovery --parallel --verbose 2>&1 | tee test-output.txt
          # Create a simple XML report for test reporter
          echo '<?xml version="1.0" encoding="UTF-8"?>' > test-results.xml
          echo '<testsuites>' >> test-results.xml
          echo '  <testsuite name="TandemKitTests" tests="$(grep -c "Test Case.*passed" test-output.txt || echo 0)" failures="0" time="0.01">' >> test-results.xml
          grep "Test Case.*passed" test-output.txt | while read line; do
            test_name=$(echo "$line" | sed 's/.*Test Case.*\[\([^]]*\)\].*/\1/')
            echo "    <testcase name=\"$test_name\" classname=\"TandemKitTests\" time=\"0.001\">" >> test-results.xml
            echo "      <system-out>$line</system-out>" >> test-results.xml
            echo "    </testcase>" >> test-results.xml
          done
          echo '  </testsuite>' >> test-results.xml
          echo '</testsuites>' >> test-results.xml
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TandemKit/test-results.xml

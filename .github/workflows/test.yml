name: Test Trio (with TandemKit under test)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main, dev ]
    paths:
      - '.github/workflows/build.yml'
      - '.github/workflows/test.yml'
      - 'Sources/**'
      - 'Tests/**'
      - 'Package.swift'
      - 'Package.resolved'
      - '*.xcodeproj/**'
      - '*.xcworkspace/**'
  pull_request_target:
    types: [ labeled ]
    branches: [ main, dev ]
  workflow_dispatch:
    inputs:
      trio_repo:
        description: "Repo to test (must contain TandemKit submodule at path TandemKit)"
        required: false
        default: "jwoglom/Trio-tandem"
      trio_ref:
        description: "Git ref (branch/tag/SHA) for trio_repo"
        required: false
        default: ""

jobs:
  test-trio:
    if: >
      github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_target' && github.event.label.name == 'trigger-ci')
    runs-on: [self-hosted, macOS]
    # A warm DerivedData cache builds Trio in ~9 minutes, but the first run
    # after the cache generation marker moves has to compile everything, which
    # does not fit in 25.
    timeout-minutes: 50
    environment: ${{ github.event_name == 'pull_request_target' && 'pr-testing' || '' }}
    env:
      TRIO_REPO: ${{ github.event.inputs.trio_repo || 'jwoglom/Trio-tandem' }}
      TRIO_REF: ${{ github.event.inputs.trio_ref || '' }}
      DERIVED_DATA_PATH: DerivedData
      SPM_CACHE_PATH: .spm
      TRIO_REPO_TOKEN: ${{ secrets.TRIO_REPO_TOKEN }}
      XCODEBUILD_COMMON_FLAGS: >-
        -skipMacroValidation
        -skipPackagePluginValidation
      # Ad-hoc ("sign to run locally") signing, which is what a simulator build
      # normally gets from Xcode. It must NOT be turned off: CODE_SIGNING_ALLOWED=NO
      # leaves the app with no signature and therefore no entitlements, and an iOS
      # Simulator app with no application-identifier entitlement gets an error back
      # from every Security-framework call. Trio asserts on a failed keychain read
      # (BaseKeychain reportError -> assertionFailure), so the unsigned test host
      # traps during launch and xcodebuild reports "Early unexpected exit ...
      # Test crashed with signal trap before establishing connection".
      #
      # Manual style with the "-" identity keeps this hermetic: the simulator SDK
      # needs no provisioning profile and no Apple Developer account, so nothing
      # here depends on secrets.
      SIMULATOR_CODE_SIGN_FLAGS: >-
        CODE_SIGNING_ALLOWED=YES
        CODE_SIGNING_REQUIRED=YES
        CODE_SIGN_STYLE=Manual
        CODE_SIGN_IDENTITY=-
        PROVISIONING_PROFILE_SPECIFIER=
    steps:
      # The shared actions live in this repo, and trio/TandemKit cannot be checked out before the
      # Trio checkout (which empties trio/), so fetch just the actions first.
      - name: Checkout TandemKit CI actions
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          path: .tandemkit-ci
          sparse-checkout: .github/actions
          fetch-depth: 1

      - name: Set up Xcode and a simulator
        uses: ./.tandemkit-ci/.github/actions/setup-simulator

      - name: Check out Trio with TandemKit under test
        uses: ./.tandemkit-ci/.github/actions/checkout-trio
        with:
          repository: ${{ env.TRIO_REPO }}
          ref: ${{ env.TRIO_REF }}
          token: ${{ env.TRIO_REPO_TOKEN }}
          tandemkit-ref: ${{ github.event.pull_request.head.sha || github.ref }}

      - name: Validate Xcode source membership (all targets)
        run: |
          ruby -e 'begin; require "xcodeproj"; rescue LoadError; exit 1; end' || gem install xcodeproj --no-document
          ruby scripts/check_xcodeproj_source_membership.rb --check
        working-directory: trio/TandemKit

      - name: Cache SwiftPM artifacts
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.DERIVED_DATA_PATH }}/SourcePackages
            ~/.swiftpm
            ${{ env.SPM_CACHE_PATH }}
          key: ${{ runner.os }}-xcode-${{ env.XCODE_VERSION }}-spm-${{ hashFiles('trio/**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-xcode-${{ env.XCODE_VERSION }}-spm-

      # `-v2-` is a cache generation marker. Bump it whenever a build setting
      # changes in a way the hashed files do not capture -- the signing flags
      # above are part of Xcode's build description, so a snapshot taken under
      # the old flags forces a full rebuild on every restore and, because the
      # key already exists, never gets replaced.
      - name: Cache Xcode DerivedData intermediates
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.DERIVED_DATA_PATH }}/Build
            ${{ env.DERIVED_DATA_PATH }}/ModuleCache.noindex
          key: ${{ runner.os }}-xcode-${{ env.XCODE_VERSION }}-dd-trio-v2-${{ hashFiles('trio/**/Package.resolved', 'trio/**/*.xcodeproj/project.pbxproj', 'trio/**/*.xcworkspace/contents.xcworkspacedata') }}
          restore-keys: |
            ${{ runner.os }}-xcode-${{ env.XCODE_VERSION }}-dd-trio-v2-${{ hashFiles('trio/**/Package.resolved') }}-
            ${{ runner.os }}-xcode-${{ env.XCODE_VERSION }}-dd-trio-v2-

      - name: Build Trio tests for execution (no test run)
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -workspace "trio/Trio.xcworkspace" \
            -scheme "Trio Tests" \
            -configuration Debug \
            -destination "${SIMULATOR_DESTINATION}" \
            -derivedDataPath "${DERIVED_DATA_PATH}" \
            ${XCODEBUILD_COMMON_FLAGS} \
            -quiet \
            ${SIMULATOR_CODE_SIGN_FLAGS} \
            2>&1 | tee "xcodebuild-build-for-testing.log"

      - name: Wait for the simulator to finish booting
        run: |
          set -euo pipefail
          xcrun simctl bootstatus "${SIMULATOR_UDID}" -b || true

      - name: Run Trio tests without rebuilding
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -workspace "trio/Trio.xcworkspace" \
            -scheme "Trio Tests" \
            -configuration Debug \
            -destination "${SIMULATOR_DESTINATION}" \
            -derivedDataPath "${DERIVED_DATA_PATH}" \
            -resultBundlePath "TrioTests.xcresult" \
            ${XCODEBUILD_COMMON_FLAGS} \
            -retry-tests-on-failure \
            -quiet \
            ${SIMULATOR_CODE_SIGN_FLAGS} \
            2>&1 | tee "xcodebuild-test.log"

      - name: Upload test logs/results (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: trio-test-artifacts
          path: |
            xcodebuild-build-for-testing.log
            xcodebuild-test.log
            TrioTests.xcresult

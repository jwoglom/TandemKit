name: Linux

# The Linux slice of the package: Sources/TandemCore and Sources/TandemKit compiled as one module
# against LinuxShims/ (see Package.swift), which is the only build Claude Code web sessions have.
# This catches a change that breaks the shims, and runs the tests Package.swift declares for Linux.
# JPAKE is a trapping stub here, so its tests compile out, fresh pairing among them.
#
# plain and virtual-pump build side by side: the flag changes every module's compilation
# conditions, so they share nothing but the toolchain. The faketandem job builds the emulator
# alongside them. integration then runs TandemKitIntegrationTests in two halves at once, against
# that emulator, on virtual-pump's build restored from its cache. All use the toolchain
# scripts/claude-web-setup.sh installs, so a session that passes `swift test` locally sees the
# same compiler here.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main, dev ]
  pull_request:
  workflow_dispatch:
    inputs:
      faketandem_ref:
        description: "faketandem branch/tag/SHA for the integration tests (default: its default branch)"
        required: false
        default: ""

jobs:
  plain:
    name: plain build + tests
    runs-on: ubuntu-latest
    container: swift:6.1.2-noble
    timeout-minutes: 20
    # Steps in a container job default to sh, which has no pipefail.
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout TandemKit
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Install Ruby and Python for the checks
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends ruby python3 > /dev/null
          gem install xcodeproj --no-document

      - name: Validate Xcode source membership (all targets)
        run: ruby scripts/check_xcodeproj_source_membership.rb --check

      # Keyed on the sources so a change saves a fresh entry; the fallback restores the nearest one
      # and the build is incremental from it.
      - name: Cache the build
        uses: actions/cache@v6
        with:
          path: |
            .build
            ~/.cache/org.swift.swiftpm
          key: linux-swift-6.1.2-plain-${{ hashFiles('Package.swift', 'Sources/**', 'Tests/**', 'LinuxShims/**') }}
          restore-keys: |
            linux-swift-6.1.2-plain-

      - name: Build, including test targets
        run: swift build --build-tests

      # ubuntu-latest has 4 cores. A parallel run prints no "Executed N tests" line, so the count
      # comes from the xunit report.
      - name: Run tests
        run: swift test --skip-build --parallel --num-workers 4 --xunit-output swift-test.xml 2>&1 | tee swift-test.log

      - name: Check that tests actually ran
        run: scripts/ci/check-test-count.py --xunit swift-test.xml --label "Linux tests"

      - name: Upload test logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: linux-plain-test-logs
          path: |
            swift-test.log
            swift-test.xml

  # The Harmonize lint rules (HarmonizeRules/, rooted by .harmonize.yaml) parse the sources rather than
  # compile them, so they need neither the shims nor the driver's build.
  harmonize:
    name: Harmonize lint rules
    runs-on: ubuntu-latest
    container: swift:6.1.2-noble
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout TandemKit
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Install Python for the checks
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends python3 > /dev/null

      - name: Cache the build
        uses: actions/cache@v6
        with:
          path: HarmonizeRules/.build
          key: linux-swift-6.1.2-harmonize-${{ hashFiles('HarmonizeRules/Package.resolved', 'HarmonizeRules/Tests/**') }}
          restore-keys: |
            linux-swift-6.1.2-harmonize-

      - name: Run the Harmonize rules
        run: swift test --package-path HarmonizeRules 2>&1 | tee harmonize.log

      - name: Check that the rules actually ran
        run: scripts/ci/check-test-count.py harmonize.log --label "Harmonize rules"

      - name: Upload the log (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: linux-harmonize-log
          path: harmonize.log

  virtual-pump:
    name: virtual pump build + tests
    runs-on: ubuntu-latest
    container: swift:6.1.2-noble
    timeout-minutes: 20
    # Declares TandemKitIntegrationTests (Package.swift), so the cached build carries it for the
    # integration job.
    env:
      TANDEMKIT_INTEGRATION_TESTS: '1'
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout TandemKit
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Install Python for the checks
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends python3 > /dev/null

      - name: Cache the build
        uses: actions/cache@v6
        with:
          path: |
            .build-virtual
            ~/.cache/org.swift.swiftpm
          key: linux-swift-6.1.2-virtual-pump-${{ hashFiles('Package.swift', 'Sources/**', 'Tests/**', 'LinuxShims/**') }}
          restore-keys: |
            linux-swift-6.1.2-virtual-pump-

      # VirtualPump/ compiles only with the flag.
      - name: Build with the virtual pump
        run: swift build --build-tests --build-path .build-virtual -Xswiftc -DTANDEMKIT_VIRTUAL_PUMP

      - name: Run the virtual CoreBluetooth tests
        run: |
          swift test --skip-build --build-path .build-virtual -Xswiftc -DTANDEMKIT_VIRTUAL_PUMP \
            --filter VirtualCoreBluetoothTests 2>&1 | tee swift-test-virtual-pump.log

      - name: Check that the virtual CoreBluetooth tests actually ran
        run: scripts/ci/check-test-count.py swift-test-virtual-pump.log --label "Linux VirtualCoreBluetoothTests"

      - name: Upload test logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: linux-virtual-pump-test-logs
          path: swift-test-virtual-pump.log

  # In the same image as the integration jobs, so the binary links against the libc they run.
  faketandem:
    name: faketandem build
    runs-on: ubuntu-latest
    container: swift:6.1.2-noble
    timeout-minutes: 15
    env:
      FAKETANDEM_REF: ${{ github.event.inputs.faketandem_ref || '' }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout faketandem
        uses: actions/checkout@v6
        with:
          repository: jwoglom/faketandem
          ref: ${{ env.FAKETANDEM_REF }}
          path: faketandem
          fetch-depth: 1

      # The swift image has neither; `make jar` downloads the jar with curl.
      - name: Install curl and make
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends ca-certificates curl make > /dev/null

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - name: Cache the pumpX2 cliparser jar
        uses: actions/cache@v6
        with:
          path: faketandem/third_party
          key: pumpx2-cliparser-${{ hashFiles('faketandem/Makefile') }}

      # Laid out as the script reads a faketandem checkout: the binary at the top, the jar in
      # third_party/.
      - name: Build faketandem and fetch the pumpX2 cliparser jar
        working-directory: faketandem
        run: |
          if ! ls third_party/pumpx2-cliparser-*.jar >/dev/null 2>&1; then
            make jar
          fi
          mkdir -p ../faketandem-dist/third_party
          cp "$(ls -t third_party/pumpx2-cliparser-*.jar | head -n1)" ../faketandem-dist/third_party/
          go build -o ../faketandem-dist/faketandem .
          ls -lR ../faketandem-dist

      - name: Upload faketandem
        uses: actions/upload-artifact@v7
        with:
          name: linux-faketandem
          path: faketandem-dist/
          if-no-files-found: error
          retention-days: 1

  # integration_fault takes the conformance groups built on injected link and response faults (A-D
  # and F in docs/conformance-test-plan.md), integration everything else, so a new class lands in
  # integration unless it is added to FAULT_SUITES.
  integration:
    name: ${{ matrix.suite }} tests (faketandem)
    needs: [virtual-pump, faketandem]
    runs-on: ubuntu-latest
    container: swift:6.1.2-noble
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: integration
            selection: --skip
          - suite: integration_fault
            selection: --filter
    env:
      TANDEMKIT_INTEGRATION_TESTS: '1'
      FAULT_SUITES: 'TandemKitIntegrationTests\.(Interrupt|Cancel|Idempotency|PumpSide|Outage)ConformanceTests'
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout TandemKit
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # curl for the script's API wait, python3 for its free ports and the checks.
      - name: Install curl and Python
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends curl python3 > /dev/null

      - name: Restore the virtual pump build
        id: build-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            .build-virtual
            ~/.cache/org.swift.swiftpm
          key: linux-swift-6.1.2-virtual-pump-${{ hashFiles('Package.swift', 'Sources/**', 'Tests/**', 'LinuxShims/**') }}
          restore-keys: |
            linux-swift-6.1.2-virtual-pump-

      - name: Download faketandem
        uses: actions/download-artifact@v8
        with:
          name: linux-faketandem
          path: faketandem

      # faketandem runs pumpX2's jpake-server from the cliparser jar.
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # An exact hit is virtual-pump's build of these sources, run as is: the checkout's file times
      # are newer than the cached build's, so a build here would recompile all of it. Anything else
      # was built from older sources and is only a starting point.
      - name: Run TandemKitIntegrationTests against faketandem
        env:
          FAKETANDEM_DIR: faketandem
          FAKETANDEM_BIN: faketandem/faketandem
          LOG_DIR: integration-logs
          MODE: ${{ steps.build-cache.outputs.cache-hit == 'true' && 'test' || 'all' }}
        run: |
          chmod +x "$FAKETANDEM_BIN"
          scripts/integration-test.sh "$MODE" ${{ matrix.selection }} "$FAULT_SUITES"

      # Every test throws XCTSkip when the emulator's addresses do not reach the test process, so
      # a run that never talked to faketandem would still pass.
      - name: Check that integration tests actually ran
        run: scripts/ci/check-test-count.py integration-logs/swift-test.log --label "Linux ${{ matrix.suite }}" --no-skips

      - name: Upload test logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.suite }}-test-logs
          path: integration-logs/

name: TandemKit unit tests

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main, dev ]
  pull_request:
  workflow_dispatch:
    inputs:
      faketandem_ref:
        description: "faketandem branch/tag/SHA for the integration tests (default: its default branch)"
        required: false
        default: ""

# LoopKit.framework/LoopKitUI.framework come from .github/actions/loopkit-frameworks, which
# builds them from the loopandlearn/LoopKit revision Trio pins, without Trio or secrets, so these
# jobs run on every push and pull request, forks included.
jobs:
  unit-tests:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 40
    env:
      DERIVED_DATA_PATH: DerivedData
      XCODEBUILD_COMMON_FLAGS: >-
        -skipMacroValidation
        -skipPackagePluginValidation
    steps:
      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Capture Xcode version for cache keys
        run: |
          set -euo pipefail
          XCODE_VERSION="$(xcodebuild -version | awk 'NR==1{print $2}')"
          echo "XCODE_VERSION=${XCODE_VERSION}" >> "${GITHUB_ENV}"

      - name: Select an available iPhone simulator
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, subprocess

          def runtime_sort_key(rt: str):
            m = re.search(r"iOS-(\d+)-(\d+)", rt)
            return (int(m.group(1)), int(m.group(2))) if m else (0, 0)

          data = subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"], text=True)
          j = json.loads(data)

          ios_runtimes = sorted([rt for rt in j.get("devices", {}).keys() if ".iOS-" in rt], key=runtime_sort_key, reverse=True)
          if not ios_runtimes:
            raise SystemExit("No iOS runtimes found on runner")

          candidates = []
          for rt in ios_runtimes:
            for dev in j["devices"].get(rt, []):
              if not dev.get("isAvailable"):
                continue
              name = dev.get("name", "")
              if name.startswith("iPhone"):
                candidates.append((name, dev.get("udid"), rt))
            if candidates:
              break

          if not candidates:
            raise SystemExit("No available iPhone simulators found on runner")

          preferred = next((c for c in candidates if c[0] == "iPhone 16"), candidates[0])
          name, udid, rt = preferred
          print(f"Selected simulator: {name} ({udid}) [{rt}]")

          with open(os.environ["GITHUB_ENV"], "a") as f:
            f.write(f"SIMULATOR_DESTINATION=platform=iOS Simulator,id={udid}\n")
            f.write(f"SIMULATOR_UDID={udid}\n")
          PY

      # First boot of a simulator device on a fresh runner takes ~5-6 minutes,
      # almost all of it CoreSimulator running one-shot data-migration plugins.
      # `simctl boot` only kicks the boot off -- simd carries it out, so this
      # returns in a second or two and the device keeps booting while we check
      # out and build. The wait happens in "Wait for the simulator to finish
      # booting", immediately before the tests, by which point the boot is
      # usually done or nearly so. Nothing before that step needs a live
      # simulator: xcodebuild only needs the destination to *exist* to pick an
      # SDK and architecture.
      - name: Start booting the simulator in the background
        run: |
          set -euo pipefail
          xcrun simctl boot "${SIMULATOR_UDID}" || true

      - name: Checkout TandemKit
        uses: actions/checkout@v4
        with:
          path: TandemKit
          fetch-depth: 1

      - name: Validate Xcode source membership (all targets)
        run: |
          ruby -e 'begin; require "xcodeproj"; rescue LoadError; exit 1; end' || gem install xcodeproj --no-document
          ruby scripts/check_xcodeproj_source_membership.rb --check
        working-directory: TandemKit

      - name: Cache SwiftPM artifacts
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.DERIVED_DATA_PATH }}/SourcePackages
            ~/.swiftpm
          key: ${{ runner.os }}-xcode-${{ env.XCODE_VERSION }}-tandemkit-spm-${{ hashFiles('TandemKit/TandemKit.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-xcode-${{ env.XCODE_VERSION }}-tandemkit-spm-

      - name: Stage LoopKit frameworks
        uses: ./TandemKit/.github/actions/loopkit-frameworks
        with:
          derived-data-path: ${{ env.DERIVED_DATA_PATH }}
          destination: ${{ env.SIMULATOR_DESTINATION }}
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Build TandemKitTests for execution
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project "TandemKit/TandemKit.xcodeproj" \
            -scheme "TandemKitTests" \
            -configuration Debug \
            -destination "${SIMULATOR_DESTINATION}" \
            -derivedDataPath "${DERIVED_DATA_PATH}" \
            ${XCODEBUILD_COMMON_FLAGS} \
            -quiet \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee "xcodebuild-build-for-testing.log"

      - name: Wait for the simulator to finish booting
        run: |
          set -euo pipefail
          xcrun simctl bootstatus "${SIMULATOR_UDID}" -b || true

      # -disableAutomaticPackageResolution is safe here and not on the build
      # above: build-for-testing has already resolved the graph into
      # DerivedData/SourcePackages, so re-resolving is pure network latency.
      - name: Run TandemKitTests without rebuilding
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project "TandemKit/TandemKit.xcodeproj" \
            -scheme "TandemKitTests" \
            -configuration Debug \
            -destination "${SIMULATOR_DESTINATION}" \
            -derivedDataPath "${DERIVED_DATA_PATH}" \
            -resultBundlePath "TandemKitTests.xcresult" \
            ${XCODEBUILD_COMMON_FLAGS} \
            -disableAutomaticPackageResolution \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee "xcodebuild-test.log"

      # An .xctest bundle with no test cases in it passes. That is exactly how
      # the TandemKitTests target sat broken for so long -- an empty Sources
      # build phase, a green build, and nothing actually run. Insist the run
      # reports a positive test count so "green" cannot mean "empty".
      - name: Check that tests actually ran
        run: |
          set -euo pipefail
          EXECUTED="$(
            grep -oE 'Executed [0-9]+ test' xcodebuild-test.log \
              | grep -oE '[0-9]+' \
              | sort -rn \
              | head -1 \
              || true
          )"
          if [[ -z "${EXECUTED}" ]]; then
            echo "Could not find an 'Executed N tests' line in the xcodebuild output."
            echo "Either the tests did not run or xcodebuild changed its reporting format."
            exit 1
          fi
          if [[ "${EXECUTED}" -eq 0 ]]; then
            echo "The test bundle ran 0 tests."
            exit 1
          fi
          echo "Executed ${EXECUTED} tests."
          echo "TandemKitTests: ${EXECUTED} tests executed." >> "${GITHUB_STEP_SUMMARY}"

      # TANDEMKIT_VIRTUAL_PUMP swaps CoreBluetooth for the faketandem socket (VirtualPump/), so its
      # tests only exist in a build with the flag, which VirtualPump.xcconfig sets. This rebuild
      # also fails if the driver starts using CoreBluetooth API the stand-in does not provide.
      - name: Build and run the virtual CoreBluetooth tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project "TandemKit/TandemKit.xcodeproj" \
            -scheme "TandemKitTests" \
            -configuration Debug \
            -destination "${SIMULATOR_DESTINATION}" \
            -derivedDataPath "${DERIVED_DATA_PATH}" \
            -resultBundlePath "TandemKitTests-virtual-pump.xcresult" \
            -only-testing:TandemKitTests/VirtualCoreBluetoothTests \
            -xcconfig "TandemKit/VirtualPump.xcconfig" \
            ${XCODEBUILD_COMMON_FLAGS} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee "xcodebuild-test-virtual-pump.log"
          # The whole test file is behind the flag, so a flag that did not take would pass empty.
          if ! grep -qE 'Executed [1-9][0-9]* test' xcodebuild-test-virtual-pump.log; then
            echo "No virtual CoreBluetooth tests ran; was TANDEMKIT_VIRTUAL_PUMP applied?"
            exit 1
          fi

      - name: Upload test logs/results (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tandemkit-unit-test-artifacts
          path: |
            xcodebuild-loopkit.log
            xcodebuild-build-for-testing.log
            xcodebuild-test.log
            xcodebuild-test-virtual-pump.log
            TandemKitTests.xcresult
            TandemKitTests-virtual-pump.xcresult

  # TandemKitIntegrationTests: the real driver against the faketandem emulator over its virtual
  # GATT link (docs/integration-harness.md). scripts/integration-test.sh does the orchestration,
  # the same as a local run; this job only provides what it expects to find.
  integration-tests:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 60
    env:
      DERIVED_DATA_PATH: DerivedData-virtual-pump
      FAKETANDEM_REF: ${{ github.event.inputs.faketandem_ref || '' }}
      # integration-test.sh builds faketandem from inside its checkout, so these must be absolute.
      DERIVED_DATA: ${{ github.workspace }}/DerivedData-virtual-pump
      FAKETANDEM_DIR: ${{ github.workspace }}/faketandem
      LOG_DIR: ${{ github.workspace }}/integration-logs
      TRIO_PRODUCTS: ${{ github.workspace }}/LoopKitProducts
    steps:
      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Capture Xcode version for cache keys
        run: |
          set -euo pipefail
          XCODE_VERSION="$(xcodebuild -version | awk 'NR==1{print $2}')"
          echo "XCODE_VERSION=${XCODE_VERSION}" >> "${GITHUB_ENV}"

      - name: Select an available iPhone simulator
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, subprocess

          def runtime_sort_key(rt: str):
            m = re.search(r"iOS-(\d+)-(\d+)", rt)
            return (int(m.group(1)), int(m.group(2))) if m else (0, 0)

          data = subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"], text=True)
          j = json.loads(data)

          ios_runtimes = sorted([rt for rt in j.get("devices", {}).keys() if ".iOS-" in rt], key=runtime_sort_key, reverse=True)
          if not ios_runtimes:
            raise SystemExit("No iOS runtimes found on runner")

          candidates = []
          for rt in ios_runtimes:
            for dev in j["devices"].get(rt, []):
              if not dev.get("isAvailable"):
                continue
              name = dev.get("name", "")
              if name.startswith("iPhone"):
                candidates.append((name, dev.get("udid"), rt))
            if candidates:
              break

          if not candidates:
            raise SystemExit("No available iPhone simulators found on runner")

          preferred = next((c for c in candidates if c[0] == "iPhone 16"), candidates[0])
          name, udid, rt = preferred
          print(f"Selected simulator: {name} ({udid}) [{rt}]")

          with open(os.environ["GITHUB_ENV"], "a") as f:
            f.write(f"SIMULATOR_DESTINATION=platform=iOS Simulator,id={udid}\n")
            f.write(f"DESTINATION=platform=iOS Simulator,id={udid}\n")
            f.write(f"SIMULATOR_UDID={udid}\n")
          PY

      # See unit-tests: the boot runs in the background while everything below builds.
      - name: Start booting the simulator in the background
        run: |
          set -euo pipefail
          xcrun simctl boot "${SIMULATOR_UDID}" || true

      - name: Checkout TandemKit
        uses: actions/checkout@v4
        with:
          path: TandemKit
          fetch-depth: 1

      - name: Checkout faketandem
        uses: actions/checkout@v4
        with:
          repository: jwoglom/faketandem
          ref: ${{ env.FAKETANDEM_REF }}
          path: faketandem
          fetch-depth: 1

      # Before Go 1.24 the internal linker wrote no LC_UUID, and this macOS's dyld refuses such a
      # binary at launch (golang/go#68678). faketandem vendors its modules: nothing to cache.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      # faketandem runs pumpX2's jpake-server from the cliparser jar for fresh pairings.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The Makefile pins the cliparser version, so it is the whole cache key.
      - name: Cache the pumpX2 cliparser jar
        uses: actions/cache@v4
        with:
          path: faketandem/third_party
          key: pumpx2-cliparser-${{ hashFiles('faketandem/Makefile') }}

      - name: Fetch the pumpX2 cliparser jar
        working-directory: faketandem
        run: |
          set -euo pipefail
          if ! ls third_party/pumpx2-cliparser-*.jar >/dev/null 2>&1; then
            make jar
          fi
          ls -l third_party

      - name: Cache SwiftPM artifacts
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.DERIVED_DATA_PATH }}/SourcePackages
            ~/.swiftpm
          key: ${{ runner.os }}-xcode-${{ env.XCODE_VERSION }}-tandemkit-virtual-pump-spm-${{ hashFiles('TandemKit/TandemKit.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-xcode-${{ env.XCODE_VERSION }}-tandemkit-virtual-pump-spm-

      - name: Stage LoopKit frameworks
        uses: ./TandemKit/.github/actions/loopkit-frameworks
        with:
          derived-data-path: ${{ env.DERIVED_DATA_PATH }}
          destination: ${{ env.SIMULATOR_DESTINATION }}
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Build TandemKitIntegrationTests for execution
        run: TandemKit/scripts/integration-test.sh build -quiet

      - name: Wait for the simulator to finish booting
        run: |
          set -euo pipefail
          xcrun simctl bootstatus "${SIMULATOR_UDID}" -b || true

      - name: Run TandemKitIntegrationTests against faketandem
        run: TandemKit/scripts/integration-test.sh test

      # Every test throws XCTSkip when the emulator's addresses do not reach the test process, so
      # a run that never talked to faketandem would still pass. Expected failures (the strict
      # XCTExpectFailure wrappers) are counted as failures in this line but do not fail the run.
      - name: Check that integration tests actually ran
        run: |
          set -euo pipefail
          python3 - "${LOG_DIR}/xcodebuild.log" <<'PY'
          import os, re, sys

          summaries = re.findall(r"Executed (\d+) tests?, with (?:(\d+) tests? skipped and )?(\d+) failures?", open(sys.argv[1]).read())
          if not summaries:
            raise SystemExit("Could not find an 'Executed N tests' line in the xcodebuild output.")
          executed, skipped, failures = max((int(e), int(s or 0), int(f)) for e, s, f in summaries)
          if executed == 0:
            raise SystemExit("The integration test bundle ran 0 tests.")
          if skipped:
            raise SystemExit(f"{skipped} of {executed} integration tests were skipped; only the missing-emulator check skips.")
          print(f"Executed {executed} tests ({failures} expected failures).")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
            f.write(f"TandemKitIntegrationTests: {executed} tests executed against faketandem, {failures} expected failures.\n")
          PY

      - name: Upload integration logs/results (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tandemkit-integration-test-artifacts
          path: |
            xcodebuild-loopkit.log
            ${{ env.LOG_DIR }}/faketandem.log
            ${{ env.LOG_DIR }}/xcodebuild.log
            ${{ env.LOG_DIR }}/TandemKitIntegrationTests.xcresult

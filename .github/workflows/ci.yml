name: CI

# tandemkit: TandemKit on its own, against the LoopKit frameworks from
# .github/actions/loopkit-frameworks (the loopandlearn/LoopKit revision Trio pins), with no Trio and
# no secrets, so it runs on every push and pull request, forks included.
#
# One job, one DerivedData: the unit tests build TandemKit plain, the virtual CoreBluetooth tests
# rebuild it once with VirtualPump.xcconfig, and TandemKitIntegrationTests (the driver against
# faketandem, docs/integration-harness.md) reuse that build. Every build goes through
# scripts/test-local.sh so the flagged builds share one set of build settings; a setting that
# differed would rebuild TandemKit again.
#
# trio: Trio's own tests with this TandemKit in place (trio-tests.yml), only once tandemkit has
# passed. Pushes and manual runs always get it; a pull request gets it when it carries the
# trigger-ci label and comes from a branch of this repo. Labeled fork PRs go through
# trio-fork-pr.yml instead, since a pull_request run from a fork has no secrets.
concurrency:
  # Any label added starts a run; one for a label other than trigger-ci does nothing, and its own
  # group keeps it from cancelling the run that is testing the PR.
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event.action == 'labeled' && github.event.label.name != 'trigger-ci' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

on:
  push:
    branches: [ main, dev ]
  pull_request:
    types: [ opened, synchronize, reopened, labeled ]
  workflow_dispatch:
    inputs:
      faketandem_ref:
        description: "faketandem branch/tag/SHA for the integration tests (default: its default branch)"
        required: false
        default: ""
      trio_repo:
        description: "Trio repo for the Trio tests (must contain TandemKit submodule at path TandemKit)"
        required: false
        default: "jwoglom/Trio-tandem"
      trio_ref:
        description: "Git ref (branch/tag/SHA) for trio_repo (default: its default branch)"
        required: false
        default: ""

jobs:
  tandemkit:
    name: TandemKit
    if: github.event.action != 'labeled' || github.event.label.name == 'trigger-ci'
    runs-on: [self-hosted, macOS]
    timeout-minutes: 80
    env:
      DERIVED_DATA_PATH: DerivedData
      # The scripts cd into other checkouts, so these must be absolute.
      DERIVED_DATA: ${{ github.workspace }}/DerivedData
      TRIO_PRODUCTS: ${{ github.workspace }}/LoopKitProducts
      FAKETANDEM_DIR: ${{ github.workspace }}/faketandem
      FAKETANDEM_BIN: ${{ github.workspace }}/integration-logs/faketandem
      FAKETANDEM_REF: ${{ github.event.inputs.faketandem_ref || '' }}
      LOG_DIR: ${{ github.workspace }}/integration-logs
    steps:
      - name: Checkout TandemKit
        uses: actions/checkout@v6
        with:
          path: TandemKit
          fetch-depth: 1

      - name: Set up Xcode and a simulator
        uses: ./TandemKit/.github/actions/setup-simulator

      - name: Cache SwiftPM artifacts
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.DERIVED_DATA_PATH }}/SourcePackages
            ~/.swiftpm
          key: ${{ runner.os }}-xcode-${{ env.XCODE_VERSION }}-tandemkit-spm-${{ hashFiles('TandemKit/TandemKit.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-xcode-${{ env.XCODE_VERSION }}-tandemkit-spm-

      - name: Stage LoopKit frameworks
        uses: ./TandemKit/.github/actions/loopkit-frameworks
        with:
          derived-data-path: ${{ env.DERIVED_DATA_PATH }}
          destination: ${{ env.SIMULATOR_DESTINATION }}
          xcode-version: ${{ env.XCODE_VERSION }}

      # Collected in "Finish building TandemKitTests"; everything until then does not need it.
      - name: Start building TandemKitTests in the background
        run: TandemKit/scripts/ci/background.sh start build-unit TandemKit/scripts/test-local.sh build -quiet

      - name: Validate Xcode source membership (all targets)
        run: |
          ruby -e 'begin; require "xcodeproj"; rescue LoadError; exit 1; end' || gem install xcodeproj --no-document
          ruby scripts/check_xcodeproj_source_membership.rb --check
        working-directory: TandemKit

      - name: Checkout faketandem
        uses: actions/checkout@v6
        with:
          repository: jwoglom/faketandem
          ref: ${{ env.FAKETANDEM_REF }}
          path: faketandem
          fetch-depth: 1

      # Before Go 1.24 the internal linker wrote no LC_UUID, and this macOS's dyld refuses such a
      # binary at launch (golang/go#68678). faketandem vendors its modules: nothing to cache.
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      # faketandem runs pumpX2's jpake-server from the cliparser jar for fresh pairings.
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # The Makefile pins the cliparser version, so it is the whole cache key.
      - name: Cache the pumpX2 cliparser jar
        uses: actions/cache@v6
        with:
          path: faketandem/third_party
          key: pumpx2-cliparser-${{ hashFiles('faketandem/Makefile') }}

      - name: Build faketandem and fetch the pumpX2 cliparser jar
        working-directory: faketandem
        run: |
          set -euo pipefail
          if ! ls third_party/pumpx2-cliparser-*.jar >/dev/null 2>&1; then
            make jar
          fi
          ls -l third_party
          mkdir -p "$(dirname "${FAKETANDEM_BIN}")"
          go build -o "${FAKETANDEM_BIN}" .

      - name: Finish building TandemKitTests
        run: TandemKit/scripts/ci/background.sh wait build-unit

      - name: Wait for the simulator to finish booting
        run: xcrun simctl bootstatus "${SIMULATOR_UDID}" -b || true

      # -disableAutomaticPackageResolution is safe here and not on the build
      # above: build-for-testing has already resolved the graph into
      # DerivedData/SourcePackages, so re-resolving is pure network latency.
      - name: Run TandemKitTests without rebuilding
        run: |
          set -o pipefail
          TandemKit/scripts/test-local.sh test \
            -resultBundlePath "TandemKitTests.xcresult" \
            -disableAutomaticPackageResolution \
            2>&1 | tee "xcodebuild-test.log"

      - name: Check that tests actually ran
        run: TandemKit/scripts/ci/check-test-count.py xcodebuild-test.log --label TandemKitTests

      # TANDEMKIT_VIRTUAL_PUMP swaps CoreBluetooth for the faketandem socket (VirtualPump/), so this
      # rebuilds TandemKit once. It also fails if the driver starts using CoreBluetooth API the
      # stand-in does not provide. The integration target then compiles against that build.
      - name: Build TandemKit with the virtual pump, and TandemKitIntegrationTests
        env:
          VIRTUAL_PUMP: '1'
        run: |
          set -o pipefail
          TandemKit/scripts/test-local.sh build -quiet 2>&1 | tee "xcodebuild-build-virtual-pump.log"
          TandemKit/scripts/integration-test.sh build -quiet 2>&1 | tee -a "xcodebuild-build-virtual-pump.log"

      - name: Run the virtual CoreBluetooth tests
        env:
          VIRTUAL_PUMP: '1'
        run: |
          set -o pipefail
          TandemKit/scripts/test-local.sh test \
            -resultBundlePath "TandemKitTests-virtual-pump.xcresult" \
            -only-testing:TandemKitTests/VirtualCoreBluetoothTests \
            -disableAutomaticPackageResolution \
            2>&1 | tee "xcodebuild-test-virtual-pump.log"

      # The whole test file is behind the flag, so a flag that did not take would pass empty.
      - name: Check that the virtual CoreBluetooth tests actually ran
        run: TandemKit/scripts/ci/check-test-count.py xcodebuild-test-virtual-pump.log --label VirtualCoreBluetoothTests

      - name: Run TandemKitIntegrationTests against faketandem
        run: TandemKit/scripts/integration-test.sh test -disableAutomaticPackageResolution

      # Every test throws XCTSkip when the emulator's addresses do not reach the test process, so
      # a run that never talked to faketandem would still pass. The failures it reports are the
      # strict XCTExpectFailure wrappers; an unexpected one has already failed the run.
      - name: Check that integration tests actually ran
        run: TandemKit/scripts/ci/check-test-count.py "${LOG_DIR}/xcodebuild.log" --label TandemKitIntegrationTests --no-skips

      - name: Upload test logs/results (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: tandemkit-test-artifacts
          path: |
            xcodebuild-loopkit.log
            ${{ runner.temp }}/background/build-unit.log
            xcodebuild-test.log
            xcodebuild-build-virtual-pump.log
            xcodebuild-test-virtual-pump.log
            TandemKitTests.xcresult
            TandemKitTests-virtual-pump.xcresult
            ${{ env.LOG_DIR }}/faketandem.log
            ${{ env.LOG_DIR }}/xcodebuild.log
            ${{ env.LOG_DIR }}/TandemKitIntegrationTests.xcresult

  trio:
    name: Trio
    needs: tandemkit
    if: >-
      github.event_name != 'pull_request' || (
        github.event.pull_request.head.repo.full_name == github.repository &&
        contains(github.event.pull_request.labels.*.name, 'trigger-ci'))
    uses: ./.github/workflows/trio-tests.yml
    with:
      trio_repo: ${{ inputs.trio_repo || 'jwoglom/Trio-tandem' }}
      trio_ref: ${{ inputs.trio_ref || '' }}
      tandemkit_ref: ${{ github.sha }}
    secrets:
      TRIO_REPO_TOKEN: ${{ secrets.TRIO_REPO_TOKEN }}

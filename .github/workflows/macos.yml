name: macOS

# TandemKit in the iOS simulator, against the LoopKit frameworks from .github/actions/loopkit-frameworks,
# with no Trio and no secrets. unit builds TandemKit plain and runs TandemKitTests; integration, once
# unit has passed, builds it with VirtualPump.xcconfig and runs the virtual CoreBluetooth tests and
# TandemKitIntegrationTests against faketandem (docs/integration-harness.md). Each job builds its own
# variant once, in its own work directory; the flag changes every target's compilation conditions, so
# the two builds share nothing but the LoopKit and SwiftPM caches. Every build goes through
# scripts/test-local.sh, the same path a local run takes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main, dev ]
  pull_request:
  workflow_dispatch:
    inputs:
      faketandem_ref:
        description: "faketandem branch/tag/SHA for the integration tests (default: its default branch)"
        required: false
        default: ""

permissions:
  contents: read
  actions: read

env:
  DERIVED_DATA_PATH: DerivedData
  # The scripts cd into other checkouts, so these must be absolute.
  DERIVED_DATA: ${{ github.workspace }}/DerivedData
  TRIO_PRODUCTS: ${{ github.workspace }}/LoopKitProducts

jobs:
  # On a hosted runner, so the macOS ones are not taken up by a run that is skipped. Skips everything
  # for a documentation-only change or a tree that already passed (scripts/ci/plan.sh); unit is gated
  # on it, integration and trio follow unit, and `passed` records a pass for the next run to find.
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.plan.outputs.run }}
      marker: ${{ steps.plan.outputs.marker }}
    steps:
      - name: Checkout TandemKit
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # nightscout/Trio's ref is checkout-trio's default.
      - name: Plan
        id: plan
        uses: ./.github/actions/ci-plan
        with:
          workflow: macos
          externals: |
            jwoglom/faketandem ${{ github.head_ref }}
            nightscout/Trio feat/tandem-closed-beta

  unit:
    name: unit tests
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: [self-hosted, macOS]
    # A warm run takes ~4 minutes; the rest covers rebuilding LoopKit on a cache miss.
    timeout-minutes: 20
    steps:
      - name: Checkout TandemKit
        uses: actions/checkout@v6
        with:
          path: TandemKit
          fetch-depth: 1

      - name: Set up Xcode and a simulator
        uses: ./TandemKit/.github/actions/setup-simulator

      - name: Validate Xcode source membership (all targets)
        run: |
          ruby -e 'begin; require "xcodeproj"; rescue LoadError; exit 1; end' || gem install xcodeproj --no-document
          ruby scripts/check_xcodeproj_source_membership.rb --check
        working-directory: TandemKit

      - name: Cache SwiftPM artifacts
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.DERIVED_DATA_PATH }}/SourcePackages
            ~/.swiftpm
          key: ${{ runner.os }}-xcode-${{ env.XCODE_VERSION }}-tandemkit-spm-${{ hashFiles('TandemKit/TandemKit.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-xcode-${{ env.XCODE_VERSION }}-tandemkit-spm-

      - name: Stage LoopKit frameworks
        uses: ./TandemKit/.github/actions/loopkit-frameworks
        with:
          derived-data-path: ${{ env.DERIVED_DATA_PATH }}
          destination: ${{ env.SIMULATOR_DESTINATION }}
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Build TandemKitTests
        run: |
          set -o pipefail
          TandemKit/scripts/test-local.sh build -quiet 2>&1 | tee "xcodebuild-build.log"

      - name: Wait for the simulator to finish booting
        run: xcrun simctl bootstatus "${SIMULATOR_UDID}" -b || true

      # -disableAutomaticPackageResolution is safe here and not on the build
      # above: build-for-testing has already resolved the graph into
      # DerivedData/SourcePackages, so re-resolving is pure network latency.
      - name: Run TandemKitTests without rebuilding
        run: |
          set -o pipefail
          TandemKit/scripts/test-local.sh test \
            -resultBundlePath "TandemKitTests.xcresult" \
            -disableAutomaticPackageResolution \
            2>&1 | tee "xcodebuild-test.log"

      - name: Check that tests actually ran
        run: TandemKit/scripts/ci/check-test-count.py xcodebuild-test.log --label TandemKitTests

      - name: Upload test logs/results (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: macos-unit-test-artifacts
          path: |
            xcodebuild-loopkit.log
            xcodebuild-build.log
            xcodebuild-test.log
            TandemKitTests.xcresult

  integration:
    name: integration tests (faketandem)
    needs: unit
    runs-on: [self-hosted, macOS]
    # A warm run takes ~20 minutes, ~15 of it the integration suite.
    timeout-minutes: 30
    env:
      VIRTUAL_PUMP: '1'
      FAKETANDEM_DIR: ${{ github.workspace }}/faketandem
      FAKETANDEM_BIN: ${{ github.workspace }}/integration-logs/faketandem
      FAKETANDEM_REF: ${{ github.event.inputs.faketandem_ref || '' }}
      LOG_DIR: ${{ github.workspace }}/integration-logs
    steps:
      - name: Checkout TandemKit
        uses: actions/checkout@v6
        with:
          path: TandemKit
          fetch-depth: 1

      - name: Set up Xcode and a simulator
        uses: ./TandemKit/.github/actions/setup-simulator

      - name: Cache SwiftPM artifacts
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.DERIVED_DATA_PATH }}/SourcePackages
            ~/.swiftpm
          key: ${{ runner.os }}-xcode-${{ env.XCODE_VERSION }}-tandemkit-spm-${{ hashFiles('TandemKit/TandemKit.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-xcode-${{ env.XCODE_VERSION }}-tandemkit-spm-

      - name: Stage LoopKit frameworks
        uses: ./TandemKit/.github/actions/loopkit-frameworks
        with:
          derived-data-path: ${{ env.DERIVED_DATA_PATH }}
          destination: ${{ env.SIMULATOR_DESTINATION }}
          xcode-version: ${{ env.XCODE_VERSION }}

      # TANDEMKIT_VIRTUAL_PUMP swaps CoreBluetooth for the faketandem socket (VirtualPump/). The
      # TandemKitTests build carries VirtualCoreBluetoothTests, and fails if the driver starts using
      # CoreBluetooth API the stand-in does not provide; the integration target compiles against
      # it. Collected in "Finish building"; the faketandem steps until then do not need it.
      - name: Start building TandemKit with the virtual pump in the background
        run: |
          TandemKit/scripts/ci/background.sh start build bash -c \
            'TandemKit/scripts/test-local.sh build -quiet && TandemKit/scripts/integration-test.sh build -quiet'

      # faketandem runs pumpX2's jpake-server from the cliparser jar for fresh pairings.
      - name: Build faketandem
        uses: ./TandemKit/.github/actions/faketandem
        with:
          ref: ${{ env.FAKETANDEM_REF }}
          binary: ${{ env.FAKETANDEM_BIN }}

      - name: Finish building TandemKit with the virtual pump
        run: TandemKit/scripts/ci/background.sh wait build

      - name: Wait for the simulator to finish booting
        run: xcrun simctl bootstatus "${SIMULATOR_UDID}" -b || true

      - name: Run the virtual CoreBluetooth tests
        run: |
          set -o pipefail
          TandemKit/scripts/test-local.sh test \
            -resultBundlePath "TandemKitTests-virtual-pump.xcresult" \
            -only-testing:TandemKitTests/VirtualCoreBluetoothTests \
            -only-testing:TandemKitTests/VirtualPumpControlTests \
            -only-testing:TandemKitTests/SocketListenerTests \
            -disableAutomaticPackageResolution \
            2>&1 | tee "xcodebuild-test-virtual-pump.log"

      # The whole test file is behind the flag, so a flag that did not take would pass empty.
      - name: Check that the virtual CoreBluetooth tests actually ran
        run: TandemKit/scripts/ci/check-test-count.py xcodebuild-test-virtual-pump.log --label "virtual pump tests"

      - name: Run TandemKitIntegrationTests against faketandem
        run: TandemKit/scripts/integration-test.sh test -disableAutomaticPackageResolution

      # Every test throws XCTSkip when the emulator's addresses do not reach the test process, so
      # a run that never talked to faketandem would still pass.
      - name: Check that integration tests actually ran
        run: TandemKit/scripts/ci/check-test-count.py "${LOG_DIR}/xcodebuild.log" --label TandemKitIntegrationTests --no-skips

      - name: Upload test logs/results (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: macos-integration-test-artifacts
          path: |
            xcodebuild-loopkit.log
            ${{ runner.temp }}/background/build.log
            xcodebuild-test-virtual-pump.log
            TandemKitTests-virtual-pump.xcresult
            ${{ env.LOG_DIR }}/faketandem.log
            ${{ env.LOG_DIR }}/xcodebuild.log
            ${{ env.LOG_DIR }}/TandemKitIntegrationTests.xcresult

  # Trio itself, built with this TandemKit on the virtual pump, in the simulator against faketandem.
  # scripts/trio-launcher.py installs Trio for each test, seeded with an unpaired Tandem pump, and
  # launches it with the address of TandemKit's control channel (VirtualPumpControl);
  # TrioIntegrationTests drive the driver inside Trio through it and compare what Trio stored with
  # TrioDoseStoreOracle's prediction.
  trio:
    name: Trio in the simulator (faketandem)
    needs: unit
    runs-on: [self-hosted, macOS]
    # Trio, its LoopKit and the other kits build from source on every run.
    timeout-minutes: 120
    env:
      FAKETANDEM_DIR: ${{ github.workspace }}/faketandem
      FAKETANDEM_BIN: ${{ github.workspace }}/trio-logs/faketandem
      FAKETANDEM_REF: ${{ github.event.inputs.faketandem_ref || '' }}
      LOG_DIR: ${{ github.workspace }}/trio-logs
      TRIO_DIR: ${{ github.workspace }}/trio
      TRIO_DERIVED_DATA: ${{ github.workspace }}/TrioDerivedData
    steps:
      - name: Checkout TandemKit
        uses: actions/checkout@v6
        with:
          path: TandemKit
          fetch-depth: 1

      - name: Set up Xcode and a simulator
        uses: ./TandemKit/.github/actions/setup-simulator

      - name: Cache SwiftPM artifacts
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.DERIVED_DATA_PATH }}/SourcePackages
            ~/.swiftpm
          key: ${{ runner.os }}-xcode-${{ env.XCODE_VERSION }}-tandemkit-spm-${{ hashFiles('TandemKit/TandemKit.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-xcode-${{ env.XCODE_VERSION }}-tandemkit-spm-

      # For the TrioIntegrationTests bundle, which builds in TandemKit's own project like the
      # integration tests; Trio builds its LoopKit from its submodule.
      - name: Stage LoopKit frameworks
        uses: ./TandemKit/.github/actions/loopkit-frameworks
        with:
          derived-data-path: ${{ env.DERIVED_DATA_PATH }}
          destination: ${{ env.SIMULATOR_DESTINATION }}
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Check out Trio with this TandemKit
        uses: ./TandemKit/.github/actions/checkout-trio
        with:
          tandemkit-ref: ${{ github.sha }}

      - name: Build faketandem
        uses: ./TandemKit/.github/actions/faketandem
        with:
          ref: ${{ env.FAKETANDEM_REF }}
          binary: ${{ env.FAKETANDEM_BIN }}

      - name: Build Trio and TrioIntegrationTests with the virtual pump
        run: TandemKit/scripts/trio-test.sh build -quiet

      - name: Wait for the simulator to finish booting
        run: xcrun simctl bootstatus "${SIMULATOR_UDID}" -b || true

      - name: Run TrioIntegrationTests against Trio and faketandem
        run: TandemKit/scripts/trio-test.sh test -disableAutomaticPackageResolution

      - name: Check that the Trio tests actually ran
        run: TandemKit/scripts/ci/check-test-count.py "${LOG_DIR}/xcodebuild.log" --label TrioIntegrationTests --no-skips

      - name: Upload logs, results and Trio's store (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: macos-trio-test-artifacts
          path: |
            xcodebuild-loopkit.log
            ${{ env.LOG_DIR }}
            !${{ env.LOG_DIR }}/faketandem

  passed:
    name: passed
    needs: [plan, unit, integration, trio]
    if: success() && needs.plan.outputs.run == 'true' && needs.plan.outputs.marker != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout TandemKit
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Record the pass
        uses: ./.github/actions/ci-mark-passed
        with:
          marker: ${{ needs.plan.outputs.marker }}

name: macOS

# TandemKit in the iOS simulator, against the LoopKit frameworks from .github/actions/loopkit-frameworks,
# with no Trio and no secrets. unit builds TandemKit plain and runs TandemKitTests; integration, once
# unit has passed, builds it with VirtualPump.xcconfig and runs the virtual CoreBluetooth tests and
# the TandemKitIntegrationTests classes that need macOS against faketandem
# (docs/integration-harness.md); linux.yml runs every class. trio and loop run the two host apps
# themselves on that build. Each job builds its own variant once, in its own work directory; the flag
# changes every target's compilation conditions, so the builds share nothing but the LoopKit and
# SwiftPM caches. Every build goes through scripts/test-local.sh, the same path a local run takes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main, dev ]
  pull_request:
  workflow_dispatch:
    inputs:
      faketandem_ref:
        description: "faketandem branch/tag/SHA for the integration tests (default: its default branch)"
        required: false
        default: ""
      all_integration_tests:
        description: "Run every TandemKitIntegrationTests class on macOS, not only those that need it"
        type: boolean
        default: false
      trio_ref:
        description: "nightscout/Trio branch/tag/SHA for the trio job; every job then builds against its LoopKit submodule (default: feat/tandem-closed-beta, and loopkit-frameworks' pinned LoopKit)"
        required: false
        default: ""
      loop_ref:
        description: "LoopKit/LoopWorkspace branch/tag/SHA for the loop job (default: feat/tandem-closed-beta)"
        required: false
        default: ""

permissions:
  contents: read
  actions: read

env:
  DERIVED_DATA_PATH: DerivedData
  # The scripts cd into other checkouts, so these must be absolute.
  DERIVED_DATA: ${{ github.workspace }}/DerivedData
  TRIO_PRODUCTS: ${{ github.workspace }}/LoopKitProducts

jobs:
  # On a hosted runner, so the macOS ones are not taken up by a run that is skipped. Skips everything
  # for a documentation-only change or a tree that already passed (scripts/ci/plan.sh); unit is gated
  # on it, integration and trio follow unit, and `passed` records a pass for the next run to find.
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.plan.outputs.run }}
      marker: ${{ steps.plan.outputs.marker }}
      loopkit-repository: ${{ steps.loopkit.outputs.repository }}
      loopkit-revision: ${{ steps.loopkit.outputs.revision }}
    steps:
      - name: Checkout TandemKit
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # nightscout/Trio's and LoopKit/LoopWorkspace's refs are checkout-trio's and checkout-loop's defaults.
      - name: Plan
        id: plan
        uses: ./.github/actions/ci-plan
        with:
          workflow: macos
          externals: |
            jwoglom/faketandem ${{ github.head_ref }}
            nightscout/Trio feat/tandem-closed-beta
            LoopKit/LoopWorkspace feat/tandem-closed-beta

      # Without trio_ref, loopkit-frameworks builds its pinned LoopKit.
      - name: Pick LoopKit from trio_ref's submodule
        id: loopkit
        if: inputs.trio_ref != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TRIO_REF: ${{ inputs.trio_ref }}
        run: |
          set -euo pipefail
          submodule="$(gh api "repos/nightscout/Trio/contents/LoopKit?ref=${TRIO_REF}" \
            --jq 'select(.type == "submodule") | "\(.submodule_git_url) \(.sha)"')"
          read -r url revision <<< "${submodule}"
          if [[ -z "${revision:-}" ]]; then
            echo "::error::nightscout/Trio ${TRIO_REF} has no LoopKit submodule"
            exit 1
          fi
          repository="${url#https://github.com/}"
          repository="${repository#git@github.com:}"
          repository="${repository%.git}"
          echo "repository=${repository}" >> "${GITHUB_OUTPUT}"
          echo "revision=${revision}" >> "${GITHUB_OUTPUT}"
          echo "### LoopKit: ${repository}@${revision} (nightscout/Trio ${TRIO_REF})" >> "${GITHUB_STEP_SUMMARY}"

  unit:
    name: unit tests
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: [self-hosted, macOS]
    # A warm run takes ~4 minutes; the rest covers rebuilding LoopKit on a cache miss.
    timeout-minutes: 20
    steps:
      - name: Checkout TandemKit
        uses: actions/checkout@v6
        with:
          path: TandemKit
          fetch-depth: 1

      - name: Set up Xcode and a simulator
        uses: ./TandemKit/.github/actions/setup-simulator

      - name: Validate Xcode source membership (all targets)
        run: |
          ruby -e 'begin; require "xcodeproj"; rescue LoadError; exit 1; end' || gem install xcodeproj --no-document
          ruby scripts/check_xcodeproj_source_membership.rb --check
        working-directory: TandemKit

      - name: Cache SwiftPM artifacts
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.DERIVED_DATA_PATH }}/SourcePackages
            ~/.swiftpm
          key: ${{ runner.os }}-xcode-${{ env.XCODE_VERSION }}-tandemkit-spm-${{ hashFiles('TandemKit/TandemKit.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-xcode-${{ env.XCODE_VERSION }}-tandemkit-spm-

      - name: Stage LoopKit frameworks
        uses: ./TandemKit/.github/actions/loopkit-frameworks
        with:
          derived-data-path: ${{ env.DERIVED_DATA_PATH }}
          destination: ${{ env.SIMULATOR_DESTINATION }}
          xcode-version: ${{ env.XCODE_VERSION }}
          loopkit-repository: ${{ needs.plan.outputs.loopkit-repository }}
          loopkit-revision: ${{ needs.plan.outputs.loopkit-revision }}

      - name: Build TandemKitTests
        run: |
          set -o pipefail
          TandemKit/scripts/test-local.sh build -quiet 2>&1 | tee "xcodebuild-build.log"

      - name: Wait for the simulator to finish booting
        run: xcrun simctl bootstatus "${SIMULATOR_UDID}" -b || true

      # -disableAutomaticPackageResolution is safe here and not on the build
      # above: build-for-testing has already resolved the graph into
      # DerivedData/SourcePackages, so re-resolving is pure network latency.
      - name: Run TandemKitTests without rebuilding
        run: |
          set -o pipefail
          TandemKit/scripts/test-local.sh test \
            -resultBundlePath "TandemKitTests.xcresult" \
            -disableAutomaticPackageResolution \
            2>&1 | tee "xcodebuild-test.log"

      - name: Check that tests actually ran
        run: TandemKit/scripts/ci/check-test-count.py xcodebuild-test.log --label TandemKitTests

      - name: Upload test logs/results (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: macos-unit-test-artifacts
          path: |
            xcodebuild-loopkit.log
            xcodebuild-build.log
            xcodebuild-test.log
            TandemKitTests.xcresult

  integration:
    name: integration tests (faketandem)
    needs: [plan, unit]
    runs-on: [self-hosted, macOS]
    # A warm run takes ~5 minutes; with every class, ~25.
    timeout-minutes: ${{ inputs.all_integration_tests && 45 || 20 }}
    env:
      # Linux runs every class (linux.yml). These need macOS: fresh JPAKE pairing needs SwiftECC, and
      # the rest are one pass through the plainest flows on the real LoopKit and Apple's Foundation.
      MACOS_SUITES: >-
        PairingIntegrationTests ScanIntegrationTests TransportIntegrationTests MTUIntegrationTests
        OnboardingIntegrationTests SyncIntegrationTests BolusIntegrationTests ConformanceSmokeTests
      ALL_INTEGRATION_TESTS: ${{ inputs.all_integration_tests == true }}
      VIRTUAL_PUMP: '1'
      FAKETANDEM_DIR: ${{ github.workspace }}/faketandem
      FAKETANDEM_BIN: ${{ github.workspace }}/integration-logs/faketandem
      FAKETANDEM_REF: ${{ github.event.inputs.faketandem_ref || '' }}
      LOG_DIR: ${{ github.workspace }}/integration-logs
    steps:
      - name: Checkout TandemKit
        uses: actions/checkout@v6
        with:
          path: TandemKit
          fetch-depth: 1

      - name: Set up Xcode and a simulator
        uses: ./TandemKit/.github/actions/setup-simulator

      - name: Cache SwiftPM artifacts
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.DERIVED_DATA_PATH }}/SourcePackages
            ~/.swiftpm
          key: ${{ runner.os }}-xcode-${{ env.XCODE_VERSION }}-tandemkit-spm-${{ hashFiles('TandemKit/TandemKit.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-xcode-${{ env.XCODE_VERSION }}-tandemkit-spm-

      - name: Stage LoopKit frameworks
        uses: ./TandemKit/.github/actions/loopkit-frameworks
        with:
          derived-data-path: ${{ env.DERIVED_DATA_PATH }}
          destination: ${{ env.SIMULATOR_DESTINATION }}
          xcode-version: ${{ env.XCODE_VERSION }}
          loopkit-repository: ${{ needs.plan.outputs.loopkit-repository }}
          loopkit-revision: ${{ needs.plan.outputs.loopkit-revision }}

      # TANDEMKIT_VIRTUAL_PUMP swaps CoreBluetooth for the faketandem socket (VirtualPump/). The
      # TandemKitTests build carries VirtualCoreBluetoothTests, and fails if the driver starts using
      # CoreBluetooth API the stand-in does not provide; the integration target compiles against
      # it. Collected in "Finish building"; the faketandem steps until then do not need it.
      - name: Start building TandemKit with the virtual pump in the background
        run: |
          TandemKit/scripts/ci/background.sh start build bash -c \
            'TandemKit/scripts/test-local.sh build -quiet && TandemKit/scripts/integration-test.sh build -quiet'

      # faketandem runs pumpX2's jpake-server from the cliparser jar for fresh pairings.
      - name: Build faketandem
        uses: ./TandemKit/.github/actions/faketandem
        with:
          ref: ${{ env.FAKETANDEM_REF }}
          binary: ${{ env.FAKETANDEM_BIN }}

      - name: Finish building TandemKit with the virtual pump
        run: TandemKit/scripts/ci/background.sh wait build

      - name: Wait for the simulator to finish booting
        run: xcrun simctl bootstatus "${SIMULATOR_UDID}" -b || true

      - name: Run the virtual CoreBluetooth tests
        run: |
          set -o pipefail
          TandemKit/scripts/test-local.sh test \
            -resultBundlePath "TandemKitTests-virtual-pump.xcresult" \
            -only-testing:TandemKitTests/VirtualCoreBluetoothTests \
            -only-testing:TandemKitTests/VirtualPumpControlTests \
            -only-testing:TandemKitTests/SocketListenerTests \
            -only-testing:TandemKitTests/JpakeLinkLossTests \
            -only-testing:TandemKitTests/UnsolicitedNotificationTests \
            -disableAutomaticPackageResolution \
            2>&1 | tee "xcodebuild-test-virtual-pump.log"

      # The whole test file is behind the flag, so a flag that did not take would pass empty.
      - name: Check that the virtual CoreBluetooth tests actually ran
        run: TandemKit/scripts/ci/check-test-count.py xcodebuild-test-virtual-pump.log --label "virtual pump tests"

      - name: Run TandemKitIntegrationTests against faketandem
        run: |
          selection=()
          if [[ "${ALL_INTEGRATION_TESTS}" != "true" ]]; then
            for suite in ${MACOS_SUITES}; do
              selection+=("-only-testing:TandemKitIntegrationTests/${suite}")
            done
          fi
          TandemKit/scripts/integration-test.sh test -disableAutomaticPackageResolution ${selection[@]+"${selection[@]}"}

      # Every test throws XCTSkip when the emulator's addresses do not reach the test process, so
      # a run that never talked to faketandem would still pass; a renamed class would not run at all.
      - name: Check that integration tests actually ran
        run: |
          TandemKit/scripts/ci/check-test-count.py "${LOG_DIR}/xcodebuild.log" --label TandemKitIntegrationTests \
            --no-skips --suites ${MACOS_SUITES}

      - name: Upload test logs/results (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: macos-integration-test-artifacts
          path: |
            xcodebuild-loopkit.log
            ${{ runner.temp }}/background/build.log
            xcodebuild-test-virtual-pump.log
            TandemKitTests-virtual-pump.xcresult
            ${{ env.LOG_DIR }}/faketandem.log
            ${{ env.LOG_DIR }}/xcodebuild.log
            ${{ env.LOG_DIR }}/TandemKitIntegrationTests.xcresult

  # Trio itself, built with this TandemKit on the virtual pump, in the simulator against faketandem.
  # scripts/app-launcher.py installs Trio for each test, seeded with an unpaired Tandem pump, and
  # launches it with the address of TandemKit's control channel (VirtualPumpControl);
  # TrioIntegrationTests drive the driver inside Trio through it and compare what Trio stored with
  # TrioDoseStoreOracle's prediction.
  trio:
    name: Trio in the simulator (faketandem)
    needs: [plan, unit]
    runs-on: [self-hosted, macOS]
    # Trio, its LoopKit and the other kits build from source, incrementally from the derived data
    # cache when its key hits; the time covers a build from nothing.
    timeout-minutes: 120
    env:
      FAKETANDEM_DIR: ${{ github.workspace }}/faketandem
      FAKETANDEM_BIN: ${{ github.workspace }}/trio-logs/faketandem
      FAKETANDEM_REF: ${{ github.event.inputs.faketandem_ref || '' }}
      LOG_DIR: ${{ github.workspace }}/trio-logs
    steps:
      - name: Checkout TandemKit
        uses: actions/checkout@v6
        with:
          path: TandemKit
          fetch-depth: 1

      - name: Set up Xcode and a simulator
        uses: ./TandemKit/.github/actions/setup-simulator

      - name: Cache SwiftPM artifacts
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.DERIVED_DATA_PATH }}/SourcePackages
            ~/.swiftpm
          key: ${{ runner.os }}-xcode-${{ env.XCODE_VERSION }}-tandemkit-spm-${{ hashFiles('TandemKit/TandemKit.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-xcode-${{ env.XCODE_VERSION }}-tandemkit-spm-

      # For the TrioIntegrationTests bundle, which builds in TandemKit's own project like the
      # integration tests; Trio builds its LoopKit from its submodule.
      - name: Stage LoopKit frameworks
        uses: ./TandemKit/.github/actions/loopkit-frameworks
        with:
          derived-data-path: ${{ env.DERIVED_DATA_PATH }}
          destination: ${{ env.SIMULATOR_DESTINATION }}
          xcode-version: ${{ env.XCODE_VERSION }}
          loopkit-repository: ${{ needs.plan.outputs.loopkit-repository }}
          loopkit-revision: ${{ needs.plan.outputs.loopkit-revision }}

      - name: Check out Trio with this TandemKit
        id: trio
        uses: ./TandemKit/.github/actions/checkout-trio
        with:
          ref: ${{ inputs.trio_ref }}
          tandemkit-ref: ${{ github.sha }}

      # Sets TRIO_DIR and TRIO_DERIVED_DATA, under $HOME so they are the same absolute paths on
      # every runner, which the restored build is only good for (scripts/ci/host-paths.sh).
      - name: Move Trio where every runner builds it
        id: paths
        run: TandemKit/scripts/ci/host-paths.sh trio TRIO TrioDerivedData

      # Build/ holds the compiled objects and the build database, SourcePackages/ the resolved
      # packages; Index.noindex, Logs and ModuleCache.noindex are big and remade in seconds. Not
      # keyed on the TandemKit commit: its files carry the checkout's dates, so Xcode rebuilds that
      # target from any hit, while Trio's files are dated at Trio's commit (checkout-trio) and are
      # taken as unchanged on a hit for the same one. A fallback to another Trio commit dates them
      # differently and rebuilds them, which is why the date is the commit's and never a constant.
      # Only once the checkout is at its stable path: a build under a per-runner path is good nowhere.
      - name: Cache Trio's derived data
        if: steps.paths.outputs.location == 'home'
        uses: actions/cache@v6
        with:
          path: |
            ${{ steps.paths.outputs.derived-data }}/Build
            ${{ steps.paths.outputs.derived-data }}/SourcePackages
          key: ${{ runner.os }}-${{ runner.arch }}-xcode-${{ env.XCODE_VERSION }}-trio-derived-data-${{ steps.paths.outputs.location }}-${{ steps.trio.outputs.commit }}-${{ hashFiles('trio/Trio.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-xcode-${{ env.XCODE_VERSION }}-trio-derived-data-${{ steps.paths.outputs.location }}-

      - name: Build faketandem
        uses: ./TandemKit/.github/actions/faketandem
        with:
          ref: ${{ env.FAKETANDEM_REF }}
          binary: ${{ env.FAKETANDEM_BIN }}

      - name: Build Trio and TrioIntegrationTests with the virtual pump
        run: TandemKit/scripts/trio-test.sh build -quiet

      - name: Report the size of Trio's derived data
        run: du -sh "${TRIO_DERIVED_DATA}"/* "${TRIO_DERIVED_DATA}"/Build/* || true

      - name: Wait for the simulator to finish booting
        run: xcrun simctl bootstatus "${SIMULATOR_UDID}" -b || true

      - name: Run TrioIntegrationTests against Trio and faketandem
        run: TandemKit/scripts/trio-test.sh test -disableAutomaticPackageResolution

      - name: Check that the Trio tests actually ran
        run: TandemKit/scripts/ci/check-test-count.py "${LOG_DIR}/xcodebuild.log" --label TrioIntegrationTests --no-skips

      - name: Upload logs, results and Trio's store (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: macos-trio-test-artifacts
          path: |
            xcodebuild-loopkit.log
            ${{ env.LOG_DIR }}
            !${{ env.LOG_DIR }}/faketandem

  # Loop itself, from LoopKit/LoopWorkspace feat/tandem-closed-beta with this TandemKit as its
  # TandemKitPlugin, on the virtual pump against faketandem, as trio runs Trio: upstream LoopKit and its
  # DoseStore, where trio has Trio's fork and its own pump history. LoopIntegrationTests compare both of
  # DoseStore's tables with LoopDoseStoreOracle's prediction.
  loop:
    name: Loop in the simulator (faketandem)
    needs: [plan, unit]
    runs-on: [self-hosted, macOS]
    # Loop, its LoopKit and the other kits build from source, incrementally from the derived data
    # cache when its key hits; the time covers a build from nothing.
    timeout-minutes: 120
    env:
      FAKETANDEM_DIR: ${{ github.workspace }}/faketandem
      FAKETANDEM_BIN: ${{ github.workspace }}/loop-logs/faketandem
      FAKETANDEM_REF: ${{ github.event.inputs.faketandem_ref || '' }}
      LOG_DIR: ${{ github.workspace }}/loop-logs
    steps:
      - name: Checkout TandemKit
        uses: actions/checkout@v6
        with:
          path: TandemKit
          fetch-depth: 1

      - name: Set up Xcode and a simulator
        uses: ./TandemKit/.github/actions/setup-simulator

      - name: Cache SwiftPM artifacts
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.DERIVED_DATA_PATH }}/SourcePackages
            ~/.swiftpm
          key: ${{ runner.os }}-xcode-${{ env.XCODE_VERSION }}-tandemkit-spm-${{ hashFiles('TandemKit/TandemKit.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-xcode-${{ env.XCODE_VERSION }}-tandemkit-spm-

      # For the LoopIntegrationTests bundle, which builds in TandemKit's own project like the
      # integration tests; Loop builds its own LoopKit from its submodule.
      - name: Stage LoopKit frameworks
        uses: ./TandemKit/.github/actions/loopkit-frameworks
        with:
          derived-data-path: ${{ env.DERIVED_DATA_PATH }}
          destination: ${{ env.SIMULATOR_DESTINATION }}
          xcode-version: ${{ env.XCODE_VERSION }}
          loopkit-repository: ${{ needs.plan.outputs.loopkit-repository }}
          loopkit-revision: ${{ needs.plan.outputs.loopkit-revision }}

      - name: Check out LoopWorkspace with this TandemKit
        id: loop
        uses: ./TandemKit/.github/actions/checkout-loop
        with:
          ref: ${{ inputs.loop_ref }}
          tandemkit-ref: ${{ github.sha }}

      # As in trio: LOOP_DIR and LOOP_DERIVED_DATA under $HOME, the same on every runner.
      - name: Move LoopWorkspace where every runner builds it
        id: paths
        run: TandemKit/scripts/ci/host-paths.sh loop LOOP LoopDerivedData

      # As trio's: Build/ and SourcePackages/, keyed without the TandemKit commit, LoopWorkspace's
      # files dated at its commit (checkout-loop) so a hit for the same one keeps their objects.
      - name: Cache Loop's derived data
        if: steps.paths.outputs.location == 'home'
        uses: actions/cache@v6
        with:
          path: |
            ${{ steps.paths.outputs.derived-data }}/Build
            ${{ steps.paths.outputs.derived-data }}/SourcePackages
          key: ${{ runner.os }}-${{ runner.arch }}-xcode-${{ env.XCODE_VERSION }}-loop-derived-data-${{ steps.paths.outputs.location }}-${{ steps.loop.outputs.commit }}-${{ hashFiles('loop/LoopWorkspace.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-xcode-${{ env.XCODE_VERSION }}-loop-derived-data-${{ steps.paths.outputs.location }}-

      - name: Build faketandem
        uses: ./TandemKit/.github/actions/faketandem
        with:
          ref: ${{ env.FAKETANDEM_REF }}
          binary: ${{ env.FAKETANDEM_BIN }}

      - name: Build Loop and LoopIntegrationTests with the virtual pump
        run: TandemKit/scripts/loop-test.sh build -quiet

      - name: Report the size of Loop's derived data
        run: du -sh "${LOOP_DERIVED_DATA}"/* "${LOOP_DERIVED_DATA}"/Build/* || true

      - name: Wait for the simulator to finish booting
        run: xcrun simctl bootstatus "${SIMULATOR_UDID}" -b || true

      - name: Run LoopIntegrationTests against Loop and faketandem
        run: TandemKit/scripts/loop-test.sh test -disableAutomaticPackageResolution

      - name: Check that the Loop tests actually ran
        run: TandemKit/scripts/ci/check-test-count.py "${LOG_DIR}/xcodebuild.log" --label LoopIntegrationTests --no-skips

      - name: Upload logs, results and Loop's store (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: macos-loop-test-artifacts
          path: |
            xcodebuild-loopkit.log
            ${{ env.LOG_DIR }}
            !${{ env.LOG_DIR }}/faketandem

  passed:
    name: passed
    needs: [plan, unit, integration, trio, loop]
    if: success() && needs.plan.outputs.run == 'true' && needs.plan.outputs.marker != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout TandemKit
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Record the pass
        uses: ./.github/actions/ci-mark-passed
        with:
          marker: ${{ needs.plan.outputs.marker }}

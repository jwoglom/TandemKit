name: Set up Xcode and an iPhone simulator
description: >-
  Selects the latest stable Xcode and an iPhone simulator on the newest iOS runtime, and exports
  XCODE_VERSION, SIMULATOR_DESTINATION and SIMULATOR_UDID to the job environment.

inputs:
  boot:
    description: Start booting the simulator in the background ('true' or 'false').
    default: 'true'

runs:
  using: composite
  steps:
    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Capture Xcode version for cache keys
      shell: bash
      run: |
        set -euo pipefail
        XCODE_VERSION="$(xcodebuild -version | awk 'NR==1{print $2}')"
        echo "XCODE_VERSION=${XCODE_VERSION}" >> "${GITHUB_ENV}"

    - name: Select an available iPhone simulator
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import json, os, re, subprocess

        def runtime_sort_key(rt: str):
          # rt looks like: com.apple.CoreSimulator.SimRuntime.iOS-18-6
          m = re.search(r"iOS-(\d+)-(\d+)", rt)
          return (int(m.group(1)), int(m.group(2))) if m else (0, 0)

        data = subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"], text=True)
        j = json.loads(data)

        ios_runtimes = sorted([rt for rt in j.get("devices", {}).keys() if ".iOS-" in rt], key=runtime_sort_key, reverse=True)
        if not ios_runtimes:
          raise SystemExit("No iOS runtimes found on runner")

        candidates = []
        for rt in ios_runtimes:
          for dev in j["devices"].get(rt, []):
            if dev.get("isAvailable") and dev.get("name", "").startswith("iPhone"):
              candidates.append((dev["name"], dev.get("udid"), rt))
          if candidates:
            break

        if not candidates:
          raise SystemExit("No available iPhone simulators found on runner")

        name, udid, rt = candidates[0]
        print(f"Selected simulator: {name} ({udid}) [{rt}]")

        with open(os.environ["GITHUB_ENV"], "a") as f:
          f.write(f"SIMULATOR_DESTINATION=platform=iOS Simulator,id={udid}\n")
          f.write(f"SIMULATOR_UDID={udid}\n")
        PY

    # First boot of a simulator device on a fresh runner takes ~5-6 minutes,
    # almost all of it CoreSimulator running one-shot data-migration plugins.
    # `simctl boot` only kicks the boot off -- simd carries it out, so this
    # returns in a second or two and the device keeps booting while the job
    # checks out and builds. Wait with `xcrun simctl bootstatus "$SIMULATOR_UDID" -b`
    # immediately before the tests. Nothing before that needs a live
    # simulator: xcodebuild only needs the destination to *exist* to pick an
    # SDK and architecture.
    - name: Start booting the simulator in the background
      if: inputs.boot == 'true'
      shell: bash
      run: xcrun simctl boot "${SIMULATOR_UDID}" || true

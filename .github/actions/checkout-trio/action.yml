name: Check out Trio with TandemKit under test
description: >-
  Checks out the Trio app into trio/ without its TandemKit submodule, puts the TandemKit revision
  under test at trio/TandemKit, and initializes Trio's other submodules. For jobs that run the Trio
  app in the simulator. The Trio checkout empties trio/, so a caller must fetch .github/actions
  somewhere else first (a sparse checkout of this repo) to reach this action at all.

inputs:
  repository:
    description: Trio repository (must contain a TandemKit submodule at path TandemKit); empty for nightscout/Trio.
    default: ''
  ref:
    description: Branch, tag or SHA of the Trio repository; empty for feat/tandem-closed-beta, or feat/tandem-closed-beta-next-dev when the TandemKit branch name contains next-dev.
    default: ''
  token:
    description: Token that can read the Trio repository, if it is private.
    default: ''
  tandemkit-ref:
    description: TandemKit revision to test.
    required: true

outputs:
  commit:
    description: The Trio commit checked out.
    value: ${{ steps.checkout.outputs.commit }}

runs:
  using: composite
  steps:
    - name: Checkout Trio app repository (no submodules)
      id: checkout
      uses: actions/checkout@v6
      with:
        repository: ${{ inputs.repository || 'nightscout/Trio' }}
        ref: ${{ inputs.ref || (contains(github.head_ref || github.ref_name, 'next-dev') && 'feat/tandem-closed-beta-next-dev' || 'feat/tandem-closed-beta') }}
        path: trio
        submodules: false
        fetch-depth: 1
        token: ${{ inputs.token || github.token }}

    - name: Remove Trio TandemKit submodule working tree placeholder
      shell: bash
      run: rm -rf "trio/TandemKit"

    - name: Checkout TandemKit under test into trio/TandemKit
      uses: actions/checkout@v6
      with:
        ref: ${{ inputs.tandemkit-ref }}
        path: trio/TandemKit
        fetch-depth: 1

    - name: Initialize Trio submodules (excluding TandemKit)
      shell: bash
      run: |
        set -euo pipefail
        cd trio

        if [[ ! -f ".gitmodules" ]]; then
          exit 0
        fi

        git submodule sync --recursive

        submodule_paths=()
        while IFS= read -r path; do
          [[ -z "${path}" ]] && continue
          [[ "${path}" == "TandemKit" ]] && continue
          submodule_paths+=("${path}")
        done < <(git config -f .gitmodules --get-regexp '^submodule\..*\.path$' | awk '{print $2}')

        if [[ ${#submodule_paths[@]} -eq 0 ]]; then
          exit 0
        fi

        git submodule update --init --recursive --depth 1 "${submodule_paths[@]}"

    # For the derived data cache (scripts/ci/stamp-checkout.sh). TandemKit keeps the checkout's
    # dates, so it is rebuilt from any restored build.
    - name: Date Trio's files at its commit
      shell: bash
      run: |
        "${GITHUB_ACTION_PATH}/../../../scripts/ci/stamp-checkout.sh" trio TandemKit
